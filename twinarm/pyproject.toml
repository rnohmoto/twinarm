[project]
name = "twinarm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lerobot[dynamixel]>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["unit: fast tests that need no hardware or I/O"]

[tool.ruff]
extend = "../pyproject.toml"
