[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "twinarm"
version = "0.1.0"
description = "Twin-arm robot control package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twinarm"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# "I" (import sorting) is intentionally omitted: isort owns import order.
# E501 is omitted: black owns line length.
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --strict-markers"
markers = [
  "unit: fast tests with no external dependencies",
  "integration: tests that touch external systems or real hardware",
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
