<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koch4 XR — 仮想物体を握る・投げる</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#0f172a; font-family:"Meiryo UI",Meiryo,sans-serif; }
  #hud { position:fixed; top:10px; left:10px; z-index:10; color:#e2e8f0; background:rgba(15,23,42,.72);
         padding:8px 12px; border-radius:8px; font-size:13px; line-height:1.5; pointer-events:none; max-width:72vw; }
  #hud b { color:#fbbf24; }
  #hud .arm { color:#93c5fd; }
  #alert { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:12; display:none; max-width:80vw;
           background:rgba(127,29,29,.92); color:#fff; border:2px solid #f87171; border-radius:10px; padding:10px 16px;
           font-size:18px; font-weight:bold; line-height:1.4; pointer-events:none; text-align:center; }
  #calib { position:fixed; top:44%; left:50%; transform:translate(-50%,-50%); z-index:12; display:none; max-width:84vw;
           background:rgba(30,58,138,.92); color:#fff; border:2px solid #60a5fa; border-radius:12px; padding:14px 18px;
           font-size:17px; line-height:1.5; text-align:center; pointer-events:none; }
  #calib b { color:#fde68a; }
  #btns { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  #btns button, #editor button { font-size:14px; padding:9px 14px; border-radius:10px; border:1px solid #475569; background:#1e293b; color:#f1f5f9; cursor:pointer; }
  #btns button.on { background:#b45309; border-color:#f59e0b; }
  #btns button.calib { background:#1d4ed8; border-color:#60a5fa; }
  #btns button:active { background:#334155; }
  #editor { position:fixed; top:10px; right:10px; z-index:11; width:min(380px, 48vw); max-height:88vh; overflow:auto; color:#e2e8f0;
            background:rgba(15,23,42,.92); border:1px solid #475569; border-radius:10px; padding:10px 12px; font-size:12px; display:none; }
  #editor h3 { margin:6px 0 4px; font-size:13px; color:#fbbf24; }
  #editor label { display:inline-block; width:64px; color:#94a3b8; }
  #editor input[type=number] { width:64px; background:#0f172a; color:#f1f5f9; border:1px solid #475569; border-radius:4px; padding:2px 4px; margin:1px 4px 1px 0; }
  #editor select { background:#0f172a; color:#f1f5f9; border:1px solid #475569; border-radius:4px; }
  #editor .row { margin:2px 0; }
  #editor button { padding:4px 8px; font-size:12px; margin:2px 2px 2px 0; }
</style>
</head>
<body>
<div id="hud">Koch4 XR<br><span id="mode">接続待ち...</span></div>
<div id="alert"></div>
<div id="calib"></div>
<div id="editor"></div>
<div id="btns"></div>
<script type="module">
import * as THREE from './three.module.js';

// ───────── 既定値（ブリッジの既定と同じ。/config が返す値で上書き。v2: 腕が複数） ─────────
const DEFAULT_JOINTS = { shoulder_pan:{span_deg:180,offset_deg:0,sign:1}, shoulder_lift:{span_deg:100,offset_deg:0,sign:1},
  elbow_flex:{span_deg:100,offset_deg:0,sign:1}, wrist_flex:{span_deg:100,offset_deg:0,sign:1}, wrist_roll:{span_deg:180,offset_deg:0,sign:1} };
const DEFAULTS = {
  version: 2,
  arms: { B: { label:'リーダー', model:'koch_leader', joints: structuredClone(DEFAULT_JOINTS), base:{ x:0, y:0.75, z:-0.6, yaw_deg:0 } } },
  objects: {  // この並び順がキー 1/2/3。軽い・柔らかい → 重い・硬い。spot は 1 本目の腕のローカル座標
    sponge: { label:'スポンジ',   width:60, p_gain:250,  cap_ma:120, release:2.0, mass_g:10,  bounce:0.15, color:'#facc15', kind:'box',    spot:[-0.155,0,0.221] },
    ball:   { label:'ボール',     width:45, p_gain:900,  cap_ma:350, release:1.5, mass_g:45,  bounce:0.65, color:'#ef4444', kind:'sphere', spot:[0,0,0.27] },
    block:  { label:'鉄ブロック', width:30, p_gain:2000, cap_ma:450, release:1.0, mass_g:300, bounce:0.05, color:'#94a3b8', kind:'box',    spot:[0.155,0,0.221] },
  },
  scene: { desk:{ x:0.05, z:0.05, w:0.5, d:0.4 }, sound:true, ghost:'half' },
};
let CONFIG = structuredClone(DEFAULTS);
const JOINTS = ['shoulder_pan','shoulder_lift','elbow_flex','wrist_flex','wrist_roll'];
// 画面に出す関節名（根本から 1〜5 番目のサーボ＋グリッパ）。J キーで表示を切替え
const JOINT_NAMES = { shoulder_pan:'1 土台の回転', shoulder_lift:'2 肩', elbow_flex:'3 肘', wrist_flex:'4 手首の曲げ', wrist_roll:'5 手首の回転', gripper:'6 グリッパ' };
let showNames = true;
const GAP_MIN = 0.010, GAP_MAX = 0.040;                 // twin の指間隔 [m]（開き 0→100）
const gapAt = w => GAP_MIN + (GAP_MAX - GAP_MIN) * w / 100;
const REACH_MARGIN = 0.03;                              // 指先中点がこの距離まで寄れば「手の中」
const KEEPALIVE_MS = 500, G = 9.81, REST_LIFT = 0.002;
const THROW_MAX = 5.0, THROW_MIN = 0.15, VEL_WINDOW_MS = 110;
const SPECTATOR = new URLSearchParams(location.search).get('spectator') === '1';
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const armIds = () => Object.keys(CONFIG.arms);
const primaryId = () => armIds()[0];
const normToRad = (jm, name, v) => { const m = jm[name]; return m.sign * rad(v / 100 * m.span_deg / 2 + m.offset_deg); };

// ───────── 基本セットアップ ─────────
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 30);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.0));
const dir = new THREE.DirectionalLight(0xffffff, 1.2); dir.position.set(0.5, 1.5, 0.8); scene.add(dir);
const INLINE_BG = new THREE.Color(0x1e293b);
const grid = new THREE.GridHelper(4, 40, 0x64748b, 0x334155); scene.add(grid);   // 床（world y=0）

// ───────── Koch 分身（実寸・m）。腕ごとに 1 体。1 本目の腕のローカル座標が机と物体の基準 ─────────
const ARM_COLORS = { koch_leader: 0xd97706, koch_follower: 0x2563eb };
const box = (w,h,d,m) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
const cyl = (r,h,m) => new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20), m);
let arms = {};                                          // id -> twin
function nameTag(text){
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const g = c.getContext('2d'); g.fillStyle = 'rgba(15,23,42,.82)'; g.fillRect(0, 0, 512, 96);
  g.fillStyle = '#fde68a'; g.font = 'bold 44px sans-serif'; g.textBaseline = 'middle'; g.fillText(text, 16, 50);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest:false }));
  sp.scale.set(0.12, 0.0225, 1); sp.renderOrder = 10; return sp;
}
function makeArm(id, cfg){
  const mats = {
    base: new THREE.MeshStandardMaterial({ color:0xe2e8f0, roughness:.6 }),
    link: new THREE.MeshStandardMaterial({ color:0x334155, roughness:.5 }),
    joint: new THREE.MeshStandardMaterial({ color:0xf8fafc, roughness:.3 }),
    grip: new THREE.MeshStandardMaterial({ color: ARM_COLORS[cfg.model] ?? 0xd97706, roughness:.5 }),
  };
  const group = new THREE.Group(); scene.add(group);
  const base = box(0.05, 0.035, 0.05, mats.base); base.position.y = 0.0175; group.add(base);
  const jPan = new THREE.Group(); jPan.position.y = 0.035; base.add(jPan); jPan.add(cyl(0.016, 0.02, mats.joint));
  const jLift = new THREE.Group(); jLift.position.y = 0.02; jPan.add(jLift); jLift.add(cyl(0.014, 0.034, mats.joint).rotateZ(Math.PI/2));
  const upper = box(0.02, 0.11, 0.02, mats.link); upper.position.y = 0.055; jLift.add(upper);
  const jElbow = new THREE.Group(); jElbow.position.y = 0.11; jLift.add(jElbow); jElbow.add(cyl(0.013, 0.032, mats.joint).rotateZ(Math.PI/2));
  const fore = box(0.018, 0.108, 0.018, mats.link); fore.position.y = 0.054; jElbow.add(fore);
  const jWristF = new THREE.Group(); jWristF.position.y = 0.108; jElbow.add(jWristF); jWristF.add(cyl(0.011, 0.028, mats.joint).rotateZ(Math.PI/2));
  const wrist = box(0.016, 0.05, 0.016, mats.link); wrist.position.y = 0.025; jWristF.add(wrist);
  const jWristR = new THREE.Group(); jWristR.position.y = 0.05; jWristF.add(jWristR); jWristR.add(cyl(0.012, 0.016, mats.joint));
  const palm = box(0.034, 0.018, 0.02, mats.grip); palm.position.y = 0.017; jWristR.add(palm);
  const fingerL = box(0.006, 0.045, 0.012, mats.grip), fingerR = box(0.006, 0.045, 0.012, mats.grip);
  fingerL.position.set(-0.012, 0.048, 0); fingerR.position.set(0.012, 0.048, 0); jWristR.add(fingerL, fingerR);
  const tip = new THREE.Object3D(); tip.position.set(0, 0.065, 0); jWristR.add(tip);   // 指先の中点
  // 指先マーカー（AR で分身を消したときも、どこを「指先」と見ているかが分かる輪）
  const tipRing = new THREE.Mesh(new THREE.TorusGeometry(0.018, 0.003, 10, 28), new THREE.MeshBasicMaterial({ color: ARM_COLORS[cfg.model] ?? 0xd97706 }));
  tipRing.rotation.x = Math.PI/2; tipRing.position.y = 0.065; jWristR.add(tipRing);
  const meshes = []; group.traverse(o => { if (o.isMesh && o !== tipRing) meshes.push(o); });
  // 関節名の札（各関節の横。分身の見せ方 G の対象外）
  const tags = [[jPan,'shoulder_pan'],[jLift,'shoulder_lift'],[jElbow,'elbow_flex'],[jWristF,'wrist_flex'],[jWristR,'wrist_roll'],[tip,'gripper']].map(([node, j]) => {
    const t = nameTag(JOINT_NAMES[j]); t.position.set(0.085, 0, 0); node.add(t); return t; });
  return { id, cfg, group, jPan, jLift, jElbow, jWristF, jWristR, fingerL, fingerR, tip, tipRing, mats, meshes, tags,
           forced:null, lastSent:null, lastSentAt:0, sendStatus: SPECTATOR ? '観客(送信なし)' : '未送信', current:null,
           hist:[] };
}
function buildArms(){
  Object.values(arms).forEach(a => scene.remove(a.group));
  arms = {};
  for (const [id, cfg] of Object.entries(CONFIG.arms)) arms[id] = makeArm(id, cfg);
  applyBases(); buildDesk(); applyGhost();
}
function applyBases(){
  for (const a of Object.values(arms)) { const b = a.cfg.base; a.group.position.set(b.x, b.y, b.z); a.group.rotation.y = rad(b.yaw_deg); }
  if (arms[primaryId()]) arms[primaryId()].group.updateMatrixWorld(true);
}
const prim = () => arms[primaryId()];

// ───────── 机（1 本目の腕のローカル座標。2 本目の腕の台座も載るように広げる） ─────────
let desk = null, deskRect = { x0:-0.2, x1:0.3, z0:-0.15, z1:0.25 };
const _v = new THREE.Vector3();
function buildDesk(){
  const p = prim(); if (!p) return;
  if (desk) p.group.remove(desk);
  const d = CONFIG.scene.desk;
  let x0 = d.x - d.w/2, x1 = d.x + d.w/2, z0 = d.z - d.d/2, z1 = d.z + d.d/2;
  for (const a of Object.values(arms)) {
    if (a === p) continue;
    _v.set(a.cfg.base.x, a.cfg.base.y, a.cfg.base.z); p.group.worldToLocal(_v);
    x0 = Math.min(x0, _v.x - 0.3); x1 = Math.max(x1, _v.x + 0.3); z0 = Math.min(z0, _v.z - 0.2); z1 = Math.max(z1, _v.z + 0.35);
  }
  deskRect = { x0, x1, z0, z1 };
  desk = box(x1 - x0, 0.012, z1 - z0, new THREE.MeshStandardMaterial({ color:0x475569, roughness:.8, transparent:true, opacity:0.9 }));
  desk.position.set((x0 + x1)/2, -0.006, (z0 + z1)/2); p.group.add(desk);
}

// ───────── 仮想物体（1 本目の腕のローカル座標で物理を回す。握る→指先に付く／放す→投げられる・落ちる・跳ねる） ─────────
let objs = [];
function buildObjects(){
  const p = prim(); if (!p) return;
  objs.forEach(o => p.group.remove(o.mesh));
  objs = Object.entries(CONFIG.objects).map(([name, cfg]) => {
    const d = gapAt(cfg.width);
    const sphere = cfg.kind === 'sphere';
    const geo = sphere ? new THREE.SphereGeometry(d/2, 24, 16) : new THREE.BoxGeometry(d, d*1.2, d);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:new THREE.Color(cfg.color), roughness:.7, emissive:0x000000 }));
    p.group.add(mesh);
    const o = { name, cfg, mesh, heldBy:null, v:new THREE.Vector3(), spin:new THREE.Vector3(), asleep:true,
                r: d/2, half: sphere ? d/2 : d*0.6, drag: cfg.mass_g < 20 ? 1.2 : cfg.mass_g < 100 ? 0.25 : 0.05 };
    placeAtSpot(o);
    return o;
  });
}
function placeAtSpot(o){ o.mesh.position.set(o.cfg.spot[0], o.half + REST_LIFT, o.cfg.spot[2]); o.mesh.rotation.set(0,0,0); o.heldBy = null; o.v.set(0,0,0); o.spin.set(0,0,0); o.asleep = true; o.mesh.scale.set(1,1,1); }
function resetPlacement(){ objs.forEach(placeAtSpot); Object.values(arms).forEach(a => setForced(a, null)); }

// ───────── 音（Web Audio・物が当たったとき。重いほど低く、速いほど大きい） ─────────
let actx = null;
function unlockAudio(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); }
function thud(o, speed){
  if (!CONFIG.scene.sound || !actx || speed < 0.25) return;
  const t = actx.currentTime, m = o.cfg.mass_g;
  const gain = actx.createGain(); gain.connect(actx.destination);
  const vol = Math.min(0.9, 0.12 + speed * 0.25) * (m < 20 ? 0.35 : 1);
  gain.gain.setValueAtTime(vol, t); gain.gain.exponentialRampToValueAtTime(0.001, t + (m > 100 ? 0.25 : 0.12));
  const osc = actx.createOscillator(); osc.type = m > 100 ? 'triangle' : 'sine';
  const f0 = m > 100 ? 110 : m < 20 ? 180 : 520;
  osc.frequency.setValueAtTime(f0 * 1.6, t); osc.frequency.exponentialRampToValueAtTime(f0, t + 0.06);
  osc.connect(gain); osc.start(t); osc.stop(t + 0.3);
  if (m > 100 || m < 20) {   // 鉄とスポンジにはノイズを少し重ねる（鉄=ガチャ・スポンジ=ふす）
    const n = actx.createBufferSource(); const buf = actx.createBuffer(1, 2205, actx.sampleRate); const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
    n.buffer = buf; const ng = actx.createGain(); ng.gain.setValueAtTime(vol * (m > 100 ? 0.5 : 0.15), t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    n.connect(ng); ng.connect(actx.destination); n.start(t);
  }
}

// ───────── 物理（簡易剛体: 重力・空気抵抗・机／床との衝突・反発と摩擦・球同士の衝突） ─────────
function floorY(){ const p = prim(); return p ? -p.cfg.base.y : -0.75; }      // world y=0 を 1 本目ローカルで
function onDesk(x, z){ return x >= deskRect.x0 && x <= deskRect.x1 && z >= deskRect.z0 && z <= deskRect.z1; }
function stepPhysics(o, dt){
  if (o.heldBy || o.asleep) return;
  o.v.y -= G * dt;
  o.v.multiplyScalar(Math.max(0, 1 - o.drag * dt));
  o.mesh.position.addScaledVector(o.v, dt);
  o.mesh.rotation.x += o.spin.x * dt; o.mesh.rotation.y += o.spin.y * dt; o.mesh.rotation.z += o.spin.z * dt;
  const pos = o.mesh.position;
  const ground = onDesk(pos.x, pos.z) ? 0 : floorY();
  if (pos.y - o.half <= ground && o.v.y <= 0) {
    const speed = Math.abs(o.v.y);
    pos.y = ground + o.half;
    const bounce = o.cfg.bounce * (ground === 0 ? 1 : 0.8);
    o.v.y = speed > 0.3 ? speed * bounce : 0;
    o.v.x *= 0.6; o.v.z *= 0.6; o.spin.multiplyScalar(0.5);
    if (speed > 0.3) thud(o, speed);
    if (o.v.y === 0) {   // 滑って止まる
      const h = Math.hypot(o.v.x, o.v.z);
      if (h < 0.05) { o.v.set(0,0,0); o.spin.set(0,0,0); o.asleep = true; o.mesh.rotation.x = o.mesh.rotation.z = 0; }
    }
  }
  if (pos.y < floorY() - 1) placeAtSpot(o);   // 机からも床からも落ちた（あり得ないが保険）
}
const _n = new THREE.Vector3(), _rel = new THREE.Vector3();
function collideObjects(){
  for (let i = 0; i < objs.length; i++) for (let j = i + 1; j < objs.length; j++) {
    const a = objs[i], b = objs[j];
    if (a.heldBy && b.heldBy) continue;
    _n.subVectors(b.mesh.position, a.mesh.position); const dist = _n.length(), minD = a.r + b.r;
    if (dist <= 1e-6 || dist >= minD) continue;
    _n.divideScalar(dist);
    const ma = a.heldBy ? 1e9 : a.cfg.mass_g, mb = b.heldBy ? 1e9 : b.cfg.mass_g;
    const push = (minD - dist);
    if (!a.heldBy) a.mesh.position.addScaledVector(_n, -push * mb / (ma + mb));
    if (!b.heldBy) b.mesh.position.addScaledVector(_n,  push * ma / (ma + mb));
    _rel.subVectors(b.v, a.v); const vn = _rel.dot(_n);
    if (vn < 0) {
      const e = Math.min(a.cfg.bounce, b.cfg.bounce) * 0.8 + 0.1;
      const jimp = -(1 + e) * vn / (1/ma + 1/mb);
      if (!a.heldBy) { a.v.addScaledVector(_n, -jimp / ma); a.asleep = false; }
      if (!b.heldBy) { b.v.addScaledVector(_n,  jimp / mb); b.asleep = false; }
      thud(a.cfg.mass_g > b.cfg.mass_g ? a : b, Math.abs(vn));
    }
  }
}
// 放した瞬間の速度 = 直前 ~110 ms の指先位置の差分（ローカル座標）
function releaseVelocity(arm){
  const h = arm.hist; const now = h.length ? h[h.length-1].t : 0;
  let k = h.length - 1; while (k > 0 && now - h[k].t < VEL_WINDOW_MS) k--;
  if (h.length < 2 || k === h.length - 1) return new THREE.Vector3();
  const dt = (now - h[k].t) / 1000; if (dt <= 0) return new THREE.Vector3();
  const v = h[h.length-1].p.clone().sub(h[k].p).divideScalar(dt);
  if (v.length() > THROW_MAX) v.setLength(THROW_MAX);
  if (v.length() < THROW_MIN) v.set(0, 0, 0);
  return v;
}

// ───────── /config ・ /state ─────────
function adoptConfig(cfg){
  if (!cfg || typeof cfg !== 'object') return;
  if (!cfg.arms) { // 旧形式(v1): joints/base が最上位
    cfg = { version:2, arms:{ B:{ label:'リーダー', model:'koch_leader', joints: cfg.joints ?? structuredClone(DEFAULT_JOINTS), base: cfg.base ?? structuredClone(DEFAULTS.arms.B.base) } },
            objects: cfg.objects ?? structuredClone(DEFAULTS.objects), scene: structuredClone(DEFAULTS.scene) };
  }
  cfg.scene = Object.assign(structuredClone(DEFAULTS.scene), cfg.scene || {});
  for (const o of Object.values(cfg.objects || {})) if (o.bounce === undefined) o.bounce = 0.3;
  CONFIG = cfg;
  if (!CONFIG.arms[selArm]) selArm = primaryId();
  buildArms(); buildObjects(); buildEditor(); buildButtons();
}
async function loadConfig(){
  try { const r = await fetch('/config', { cache:'no-store' }); if (r.ok) adoptConfig(await r.json()); }
  catch(e) { /* サーバなし=既定値 */ }
}
let st = null, lastOk = -1e9;
async function poll(){
  try { const r = await fetch('/state', { cache:'no-store' }); if (r.ok) { st = await r.json(); lastOk = performance.now(); } }
  catch(e) { /* サーバなし=デモ継続 */ }
}
setInterval(poll, 33);
loadConfig();

// ───────── 接触判定 → /contact 送信（腕ごと・変化時＋キープアライブ。観客モードは送らない） ─────────
const tipW = new THREE.Vector3(), objW = new THREE.Vector3(), tipL = new THREE.Vector3();
function nearestObject(arm){
  arm.tip.getWorldPosition(tipW);
  let best = null, bestD = Infinity;
  objs.forEach(o => {
    if (o.heldBy && o.heldBy !== arm.id) return;          // 他の腕が握っている物は候補にしない
    o.mesh.getWorldPosition(objW);
    const d = tipW.distanceTo(objW) - o.r;
    if (d < REACH_MARGIN && d < bestD) { best = o; bestD = d; }
  });
  return best;
}
async function sendContact(arm, o, force){
  if (SPECTATOR) return;
  const c = o ? o.cfg : null;
  const payload = c ? { name:o.name, width:c.width, p_gain:c.p_gain, cap_ma:c.cap_ma, release:c.release, mass_g:c.mass_g } : null;
  const key = JSON.stringify(payload);
  const now = performance.now();
  if (!force && key === arm.lastSent && now - arm.lastSentAt < KEEPALIVE_MS) return;
  arm.lastSent = key; arm.lastSentAt = now;
  try { const r = await fetch('/contact', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ arm: arm.id, vwall: payload }) });
        arm.sendStatus = r.ok ? `送信OK ${new Date().toLocaleTimeString()}` : `HTTP ${r.status}`; }
  catch(e) { arm.sendStatus = '送信失敗(サーバなし)'; }
}

// ───────── 1 フレーム: 姿勢を当てる → 接触 → 握る/放す/投げる → 物理 → HUD ─────────
const hudMode = document.getElementById('mode');
const alertBox = document.getElementById('alert');
let lastFrame = 0, selArm = 'B';
function armState(id, tms){
  const live = st && performance.now() - lastOk < 2000;
  const s = live ? (st.arms ? st.arms[id] : (id === primaryId() ? st : null)) : null;
  if (s && s.src !== undefined) return { pos: s.pos || {}, open: s.open ?? 100, vwall: s.vwall, vw: s.vw, vwUnit: s.vw_unit || {}, src: s.src, alerts: s.alerts || [], live:true };
  const t = tms / 1000, ph = Object.keys(arms).indexOf(id) * 1.7;
  return { pos: { shoulder_pan:40*Math.sin(t*.6+ph), shoulder_lift:45*Math.sin(t*.8+ph)+25, elbow_flex:50*Math.sin(t*.7+1+ph), wrist_flex:40*Math.sin(t*.9+2+ph), wrist_roll:60*Math.sin(t*.5+ph) },
           open: 50 + 50*Math.sin(t*1.2+ph), vwall:null, vw:null, vwUnit:{}, src:'demo', alerts:[], live:false };
}
function applyPose(tms){
  const dt = Math.min(0.05, (tms - lastFrame) / 1000 || 0.016); lastFrame = tms;
  const p = prim(); if (!p) return;
  const lines = [], alerts = [];
  const liveAny = st && performance.now() - lastOk < 2000;
  if (!liveAny) alerts.push('⚠ テレオペ／ブリッジと未接続');
  for (const arm of Object.values(arms)) {
    const s = armState(arm.id, tms), jm = arm.cfg.joints;
    arm.jPan.rotation.y = normToRad(jm, 'shoulder_pan', s.pos.shoulder_pan ?? 0);
    arm.jLift.rotation.x = normToRad(jm, 'shoulder_lift', s.pos.shoulder_lift ?? 0);
    arm.jElbow.rotation.x = normToRad(jm, 'elbow_flex', s.pos.elbow_flex ?? 0);
    arm.jWristF.rotation.x = normToRad(jm, 'wrist_flex', s.pos.wrist_flex ?? 0);
    arm.jWristR.rotation.y = normToRad(jm, 'wrist_roll', s.pos.wrist_roll ?? 0);
    const half = gapAt(s.open) / 2; arm.fingerL.position.x = -half; arm.fingerR.position.x = half;
    const tagsOn = showNames && !renderer.xr.isPresenting; for (const t of arm.tags) t.visible = tagsOn;
    arm.group.updateMatrixWorld(true);
    // 指先の位置（1 本目ローカル）と履歴（投げる速度用）
    arm.tip.getWorldPosition(tipW); p.group.worldToLocal(tipL.copy(tipW));
    arm.hist.push({ t: tms, p: tipL.clone() }); while (arm.hist.length > 12) arm.hist.shift();
    // 接触候補: 手動強制 > 近接
    arm.current = arm.forced ?? nearestObject(arm);
    sendContact(arm, arm.current, false);
    // 握る／放す
    for (const o of objs) {
      const engaged = !!(s.vwall && s.vwall.engaged && s.vwall.name === o.name && (!o.heldBy || o.heldBy === arm.id));
      if (engaged) { o.heldBy = arm.id; o.asleep = true; o.v.set(0,0,0); o.mesh.position.copy(tipL); o.mesh.rotation.set(0, arm.jPan.rotation.y, 0); }
      else if (o.heldBy === arm.id) {     // 放した: 直前の指先速度で飛ぶ
        o.heldBy = null; o.asleep = false; o.v.copy(releaseVelocity(arm));
        const sp = o.v.length(); o.spin.set((Math.random()-.5)*sp*6, (Math.random()-.5)*sp*6, (Math.random()-.5)*sp*6);
        o.mesh.scale.set(1,1,1);
      }
      if (o.heldBy === arm.id) { const pen = Math.min(0.5, Math.max(0, (o.cfg.width - s.open) / o.cfg.width)); o.mesh.scale.set(1 - 0.6*pen, 1 + 0.3*pen, 1); }
    }
    if (s.live && s.src === 'none') alerts.push(`⚠ 腕 ${arm.id}: テレオペが止まっています（分身は最後の姿勢）`);
    alerts.push(...s.alerts.map(a => (Object.keys(arms).length > 1 ? `[${arm.id}] ` : '') + a));
    const c = arm.current ? arm.current.cfg : null;
    const held = objs.find(o => o.heldBy === arm.id);
    const objTxt = held ? `<b>${held.cfg.label} を握っている</b>` : c ? `${c.label}(幅${c.width}・P${c.p_gain}・上限${c.cap_ma}mA・${c.mass_g}g)` : 'なし(自由空間)';
    const vwTxt = s.vw ? ` / 重さ ${Object.entries(s.vw).map(([j,v]) => `${j === 'shoulder_lift' ? '肩' : '肘'}${v}${s.vwUnit[j] || 'mA'}`).join('・')}` : '';
    const srcTxt = s.src === 'teleop' ? '実機' : s.src === 'sim' ? 'シミュレータ' : s.src === 'demo' ? '内蔵デモ' : '停止中';
    lines.push(`<span class="arm">${arm.id === selArm ? '▶' : '　'}${arm.id} ${arm.cfg.label}</span> ${srcTxt} 開き ${s.open.toFixed(0)} / ${objTxt}${vwTxt}` + (arm.forced ? ' <b>強制</b>' : '') + (SPECTATOR ? '' : ` / ${arm.sendStatus}`));
    if (showNames && arm.id === (arms[selArm] ? selArm : primaryId())) {   // 関節ごとの読み値と分身の角度
      for (const j of JOINTS) { const v = s.pos[j] ?? 0; lines.push(`　${JOINT_NAMES[j]} <span style="color:#94a3b8">${j}</span>: 読み値 ${v.toFixed(1)} → 分身 ${(normToRad(jm, j, v) * 180 / Math.PI).toFixed(0)}°`); }
    }
  }
  for (const o of objs) stepPhysics(o, dt);
  collideObjects();
  for (const o of objs) {
    const cand = Object.values(arms).some(a => a.current && a.current.name === o.name);
    o.mesh.material.emissive.setHex(o.heldBy ? 0x7f1d1d : cand ? 0x3f3f00 : 0x000000);
  }
  alertBox.style.display = alerts.length ? 'block' : 'none';
  alertBox.textContent = alerts.join('　|　');
  const view = renderer.xr.isPresenting ? (arActive ? 'AR(パススルー)' : 'VR') : (inlineView === 'fps' ? '一人称(モニタ用)' : '俯瞰');
  hudMode.innerHTML = lines.join('<br>') + `<br>表示: ${view}` + (calib.on ? ' / <b>位置合わせ中</b>' : '') + (SPECTATOR ? ' / <b>観客モード</b>' : '')
    + `<br>キー: 1-3 強制 0 解除 R 配置 E 編集 C 位置合わせ G 分身の見せ方 V 視点 J 関節名 S 音 Tab 腕切替`;
}

// ───────── インラインの視点: 一人称（モニタ向け・既定）／俯瞰オービット ─────────
let inlineView = 'fps';
let yaw = 0.6, pitch = 0.35, dist = 0.9, dragging = false, px = 0, py = 0;
function updateCam(){
  const p = prim(); const b = p ? p.cfg.base : { x:0, y:0.75, z:-0.6, yaw_deg:0 };
  if (inlineView === 'fps') {   // 操作者の頭の位置から: 台座の後ろ 40 cm・上 40 cm に立ち、腕が伸びる向き（腕のローカル +z）を見る
    const yawR = rad(b.yaw_deg), fx = Math.sin(yawR), fz = Math.cos(yawR);
    camera.position.set(b.x - 0.40*fx, b.y + 0.40, b.z - 0.40*fz);
    camera.lookAt(b.x + 0.20*fx, b.y + 0.05, b.z + 0.20*fz);
    return;
  }
  const target = new THREE.Vector3(b.x, b.y + 0.1, b.z + 0.05);
  camera.position.set(target.x + dist*Math.cos(pitch)*Math.sin(yaw), target.y + dist*Math.sin(pitch), target.z + dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(target);
}
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; unlockAudio(); });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging || renderer.xr.isPresenting) return;
  if (inlineView === 'fps') return;
  yaw -= (e.clientX - px) * 0.005; pitch = Math.min(1.4, Math.max(-0.2, pitch + (e.clientY - py) * 0.005));
  px = e.clientX; py = e.clientY; updateCam();
});
renderer.domElement.addEventListener('wheel', e => { dist = Math.min(3, Math.max(0.3, dist + e.deltaY * 0.001)); updateCam(); });

// ───────── 分身の見せ方（AR で実機が見えているときは半透明か指先だけ） ─────────
function applyGhost(){

  }
}
function cycleGhost(){ const order = ['solid','half','tips']; CONFIG.scene.ghost = order[(order.indexOf(CONFIG.scene.ghost || 'half') + 1) % 3]; applyGhost(); }

// ───────── 位置合わせ（C）: コントローラの先端（か手の人差し指先）を実機の指先に当ててトリガー ─────────
// 1 点目=位置（台の x/y/z）、2 点目以降=向き（yaw）も最小二乗で。姿勢を変えて 2〜3 点取る。
const calib = { on:false, armId:null, points:[], markers:[], tipOffset:0.0 };
const calibBox = document.getElementById('calib');
function startCalib(){
  if (SPECTATOR) return;
  calib.on = true; calib.armId = selArm; calib.points = []; clearCalibMarkers();
  showCalib(); buildButtons();
}
function stopCalib(save){
  calib.on = false; calibBox.style.display = 'none'; clearCalibMarkers();
  if (save) saveConfig(); buildButtons();
}
function clearCalibMarkers(){ calib.markers.forEach(m => scene.remove(m)); calib.markers = []; }
function showCalib(){
  const n = calib.points.length;
  const arm = arms[calib.armId];
  const res = n >= 2 ? `　ずれ ${(calibResidual(arm) * 100).toFixed(1)} cm` : '';
  calibBox.style.display = 'block';
  calibBox.innerHTML = `<b>位置合わせ: 腕 ${calib.armId}（${arm ? arm.cfg.label : ''}）</b><br>`
    + `実機の<b>指先の中点</b>にコントローラの先端（か人差し指の先）を当てて<b>トリガー</b>。`
    + `腕の姿勢を変えて 2〜3 点取る。<br>取得 ${n} 点${res}　|　<b>確定</b>で保存・<b>取消</b>で 1 点戻す・<b>中止</b>`;
}
function captureCalibPoint(worldPos){
  const arm = arms[calib.armId]; if (!arm) return;
  arm.tip.getWorldPosition(tipW); const q = arm.group.worldToLocal(tipW.clone());   // 指先の腕ローカル位置（台の推定に依存しない）
  calib.points.push({ p: worldPos.clone(), q });
  const mk = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8), new THREE.MeshBasicMaterial({ color:0x60a5fa })); mk.position.copy(worldPos); scene.add(mk); calib.markers.push(mk);
  solveCalib(arm); showCalib();
}
function undoCalibPoint(){ if (!calib.points.length) return; calib.points.pop(); const mk = calib.markers.pop(); if (mk) scene.remove(mk); const arm = arms[calib.armId]; if (calib.points.length && arm) solveCalib(arm); showCalib(); }
// three.js の rotation.y=θ: x' = x cosθ + z sinθ, z' = −x sinθ + z cosθ
function rotY(v, th){ return new THREE.Vector3(v.x*Math.cos(th) + v.z*Math.sin(th), v.y, -v.x*Math.sin(th) + v.z*Math.cos(th)); }
function solveCalib(arm){
  const pts = calib.points; if (!pts.length) return;
  const b = arm.cfg.base;
  let th = rad(b.yaw_deg);
  if (pts.length >= 2) {
    const pc = new THREE.Vector3(), qc = new THREE.Vector3();
    pts.forEach(({p, q}) => { pc.add(p); qc.add(q); }); pc.divideScalar(pts.length); qc.divideScalar(pts.length);
    let sn = 0, cs = 0;
    pts.forEach(({p, q}) => { const a = q.clone().sub(qc), bb = p.clone().sub(pc); sn += a.z*bb.x - a.x*bb.z; cs += a.x*bb.x + a.z*bb.z; });
    if (Math.hypot(sn, cs) > 1e-6) th = Math.atan2(sn, cs);
  }
  const pc = new THREE.Vector3(), rq = new THREE.Vector3();
  pts.forEach(({p, q}) => { pc.add(p); rq.add(rotY(q, th)); }); pc.divideScalar(pts.length); rq.divideScalar(pts.length);
  b.x = +(pc.x - rq.x).toFixed(4); b.y = +(pc.y - rq.y).toFixed(4); b.z = +(pc.z - rq.z).toFixed(4); b.yaw_deg = +deg(th).toFixed(2);
  applyBases(); buildDesk(); buildEditor();
}
function calibResidual(arm){
  const b = arm.cfg.base, th = rad(b.yaw_deg); let s = 0;
  calib.points.forEach(({p, q}) => { const w = rotY(q, th).add(new THREE.Vector3(b.x, b.y, b.z)); s += w.distanceToSquared(p); });
  return Math.sqrt(s / Math.max(1, calib.points.length));
}
// 自己診断（デスクトップのコンソールで koch4SelfTest()）: 既知の台から点を作って解き直す
window.koch4SelfTest = function(){
  const arm = prim(); const truth = { x:0.31, y:0.72, z:-0.55, yaw_deg:-37 };
  const qs = [new THREE.Vector3(0.1, 0.25, 0.15), new THREE.Vector3(-0.12, 0.2, 0.22), new THREE.Vector3(0.05, 0.3, -0.08)];
  calib.points = qs.map(q => ({ q: q.clone(), p: rotY(q, rad(truth.yaw_deg)).add(new THREE.Vector3(truth.x, truth.y, truth.z)) }));
  const keep = structuredClone(arm.cfg.base);
  arm.cfg.base = { x:0, y:0.75, z:-0.6, yaw_deg:0 }; solveCalib(arm);
  const got = structuredClone(arm.cfg.base), res = calibResidual(arm);
  arm.cfg.base = keep; calib.points = []; applyBases(); buildDesk();
  const ok = Math.abs(got.x-truth.x) < 1e-3 && Math.abs(got.y-truth.y) < 1e-3 && Math.abs(got.z-truth.z) < 1e-3 && Math.abs(got.yaw_deg-truth.yaw_deg) < 0.05 && res < 1e-3;
  return { ok, got, truth, residual_m: res };
};

// ───────── XR 入力（コントローラ／ハンド）: 位置合わせの点取りに使う。制御はしない ─────────

addEventListener('keydown', e => {

  editor.appendChild(num('y', () => b.y, v => b.y = v, 0.01, undefined, undefined, afterBase));
  editor.appendChild(num('z', () => b.z, v => b.z = v, 0.01, undefined, undefined, afterBase));
  editor.appendChild(num('yaw', () => b.yaw_deg, v => b.yaw_deg = v, 5, undefined, undefined, afterBase));
  const ho = document.createElement('h3'); ho.textContent = '物体（幅・P・上限mA・重さg・反発0-1）'; editor.appendChild(ho);
  objs.forEach(o => {
    const c = o.cfg;
    const d = document.createElement('div'); d.className = 'row'; d.innerHTML = `<label>${c.label}</label>`;
    [['width',1,0,100],['p_gain',50,0,16383],['cap_ma',10,0,900],['mass_g',5,0,2000],['bounce',0.05,0,1]].forEach(([k,step,lo,hi]) => {
      const i = document.createElement('input'); i.type = 'number'; i.step = step; i.min = lo; i.max = hi; i.value = c[k]; i.title = k;
      i.oninput = () => { const v = parseFloat(i.value); if (!isNaN(v)) { c[k] = v; if (k === 'width') buildObjects(); } };
      d.appendChild(i);
    });
    const here = document.createElement('button'); here.textContent = 'ここに置く';
    here.onclick = () => { arm.tip.getWorldPosition(tipW); prim().group.worldToLocal(tipL.copy(tipW)); c.spot = [+tipL.x.toFixed(3), 0, +tipL.z.toFixed(3)]; placeAtSpot(o); };
    d.appendChild(here); editor.appendChild(d);
  });
  const hs = document.createElement('h3'); hs.textContent = '机（1 本目の腕の座標・m）と見せ方'; editor.appendChild(hs);
  const dk = CONFIG.scene.desk, afterDesk = () => buildDesk();
  editor.appendChild(num('x', () => dk.x, v => dk.x = v, 0.05, -2, 2, afterDesk));
  editor.appendChild(num('z', () => dk.z, v => dk.z = v, 0.05, -2, 2, afterDesk));
  editor.appendChild(num('幅 w', () => dk.w, v => dk.w = v, 0.1, 0.2, 3, afterDesk));
  editor.appendChild(num('奥行 d', () => dk.d, v => dk.d = v, 0.1, 0.2, 3, afterDesk));
  const hg = document.createElement('div'); hg.className = 'row'; hg.innerHTML = '<label>AR の分身</label>';
  const gs = document.createElement('select'); gs.innerHTML = '<option value="solid">実体</option><option value="half">半透明</option><option value="tips">指先だけ</option>'; gs.value = CONFIG.scene.ghost || 'half'; gs.onchange = () => { CONFIG.scene.ghost = gs.value; applyGhost(); };
  const snd = document.createElement('label'); snd.style.width = 'auto'; snd.style.marginLeft = '8px'; const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!CONFIG.scene.sound; cb.onchange = () => { CONFIG.scene.sound = cb.checked; }; snd.append(cb, ' 音');
  hg.append(gs, snd); editor.appendChild(hg);
}
async function saveConfig(){
  try { const r = await fetch('/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(CONFIG) });
        if (r.ok) { adoptConfig(await r.json()); for (const a of Object.values(arms)) a.sendStatus = '設定を保存'; } else { for (const a of Object.values(arms)) a.sendStatus = `設定保存 HTTP ${r.status}`; } }
  catch(e) { for (const a of Object.values(arms)) a.sendStatus = '設定保存 失敗(サーバなし)'; }
}
async function resetConfig(){
  adoptConfig(structuredClone(DEFAULTS));
  try { const r = await fetch('/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ reset:true }) });
        if (r.ok) adoptConfig(await r.json()); } catch(e) { /* offline */ }
}

// ───────── XR セッション（AR 優先・VR・非対応はインライン） ─────────
let arActive = false;
const xrButtons = [];
async function startXR(mode){
  try {
    unlockAudio();
    const init = { optionalFeatures: ['local-floor', 'dom-overlay', 'hand-tracking'], domOverlay: { root: document.body } };
    const s = await navigator.xr.requestSession(mode, init);
    arActive = (mode === 'immersive-ar');
    scene.background = arActive ? null : new THREE.Color(0x27364a);
    grid.visible = !arActive;
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(s);
    applyGhost();
    s.addEventListener('end', () => { arActive = false; scene.background = INLINE_BG; grid.visible = true; applyGhost(); if (calib.on) stopCalib(false); });
  } catch(e) { hudMode.innerHTML = 'XR開始失敗: ' + e.message; }
}
(async () => {
  scene.background = INLINE_BG;
  if (navigator.xr) {
    if (await navigator.xr.isSessionSupported('immersive-ar').catch(() => false)) xrButtons.push(['AR表示（パススルー）', () => startXR('immersive-ar')]);
    if (await navigator.xr.isSessionSupported('immersive-vr').catch(() => false)) xrButtons.push(['VR表示', () => startXR('immersive-vr')]);
  } else if (!window.isSecureContext) {
    hudMode.innerHTML = '⚠ この URL は安全なコンテキストではないため WebXR が使えません（https か http://localhost で開く）';
  }
  buildButtons();
})();
buildArms(); buildObjects(); updateCam(); buildButtons();
// デバッグ用の窓（デスクトップのコンソール／自動テストから物理と接触の状態を読む）
window.koch4 = {
  objs: () => objs.map(o => ({ name:o.name, heldBy:o.heldBy, asleep:o.asleep, p:o.mesh.position.toArray().map(v => +v.toFixed(3)), v:o.v.toArray().map(v => +v.toFixed(3)) })),
  arms: () => Object.fromEntries(Object.entries(arms).map(([k, a]) => [k, { current: a.current && a.current.name, forced: a.forced && a.forced.name, sendStatus: a.sendStatus, base: a.cfg.base }])),
  config: () => CONFIG, calib, force: (armId, name) => setForced(arms[armId], objs.find(o => o.name === name) || null),
};
const _buildObjects = buildObjects;
buildObjects = function(){ _buildObjects(); buildButtons(); };
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop((t) => { if (!renderer.xr.isPresenting) updateCam(); applyPose(t); renderer.render(scene, camera); });
</script>
