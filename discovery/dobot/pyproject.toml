[project]
name = "dobot"
version = "0.1.0"
description = "Dobot Magician pick-and-place sandbox: overhead camera -> homography -> pydobot (voice/LLM optional)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "pyserial>=3.4",          # pydobot 1.3.2 pins pyserial==3.4
    "pydobot>=1.3",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# Sandbox scripts ported from robotics/scripts/magician_pnp (S30). Docstring style is
# not enforced here, on the same standing as descovery/.
"*.py" = ["D"]
