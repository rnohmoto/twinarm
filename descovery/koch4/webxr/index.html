<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koch4 XR — 仮想物体を握る・投げる</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#0f172a; font-family:"Meiryo UI",Meiryo,sans-serif; }
  #hud { position:fixed; top:10px; left:10px; z-index:10; color:#e2e8f0; background:rgba(15,23,42,.72);
         padding:8px 12px; border-radius:8px; font-size:13px; line-height:1.5; pointer-events:none; max-width:72vw; }
  #hud b { color:#fbbf24; }
  .pane { position:fixed; z-index:9; display:none; box-sizing:border-box; border:1px solid #64748b; pointer-events:none; }
  .pane span { position:absolute; left:6px; bottom:4px; font-size:12px; color:#e2e8f0; background:rgba(15,23,42,.72); padding:1px 6px; border-radius:4px; }
  #hud .arm { color:#93c5fd; }
  #alert { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:12; display:none; max-width:80vw;
           background:rgba(127,29,29,.92); color:#fff; border:2px solid #f87171; border-radius:10px; padding:10px 16px;
           font-size:18px; font-weight:bold; line-height:1.4; pointer-events:none; text-align:center; }
  #calib { position:fixed; top:44%; left:50%; transform:translate(-50%,-50%); z-index:12; display:none; max-width:84vw;
           background:rgba(30,58,138,.92); color:#fff; border:2px solid #60a5fa; border-radius:12px; padding:14px 18px;
           font-size:17px; line-height:1.5; text-align:center; pointer-events:none; }
  #calib b { color:#fde68a; }
  #btns { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  #btns button, #editor button { font-size:14px; padding:9px 14px; border-radius:10px; border:1px solid #475569; background:#1e293b; color:#f1f5f9; cursor:pointer; }
  #btns button.on { background:#b45309; border-color:#f59e0b; }
  #btns button.calib { background:#1d4ed8; border-color:#60a5fa; }
  #btns button:active { background:#334155; }
  #editor { position:fixed; top:10px; right:10px; z-index:11; width:min(380px, 48vw); max-height:88vh; overflow:auto; color:#e2e8f0;
            background:rgba(15,23,42,.92); border:1px solid #475569; border-radius:10px; padding:10px 12px; font-size:12px; display:none; }
  #editor h3 { margin:6px 0 4px; font-size:13px; color:#fbbf24; }
  #editor label { display:inline-block; width:64px; color:#94a3b8; }
  #editor input[type=number] { width:64px; background:#0f172a; color:#f1f5f9; border:1px solid #475569; border-radius:4px; padding:2px 4px; margin:1px 4px 1px 0; }
  #editor select { background:#0f172a; color:#f1f5f9; border:1px solid #475569; border-radius:4px; }
  #editor .row { margin:2px 0; }
  #editor button { padding:4px 8px; font-size:12px; margin:2px 2px 2px 0; }
</style>
</head>
<body>
<div id="hud">Koch4 XR<br><span id="mode">接続待ち...</span></div>
<div id="alert"></div>
<div id="calib"></div>
<div id="editor"></div>
<div id="paneA" class="pane"><span></span></div>
<div id="paneB" class="pane"><span></span></div>
<div id="btns"></div>
<script type="module">
import * as THREE from './three.module.js';

// ───────── 既定値（ブリッジの既定と同じ。/config が返す値で上書き。v2: 腕が複数） ─────────
const DEFAULT_JOINTS = { shoulder_pan:{span_deg:180,offset_deg:0,sign:1}, shoulder_lift:{span_deg:100,offset_deg:0,sign:1},
  elbow_flex:{span_deg:100,offset_deg:0,sign:1}, wrist_flex:{span_deg:100,offset_deg:0,sign:1}, wrist_roll:{span_deg:180,offset_deg:0,sign:1} };
const DEFAULTS = {
  version: 2,
  arms: { B: { label:'リーダー', model:'koch_leader', joints: structuredClone(DEFAULT_JOINTS), base:{ x:0, y:0.75, z:-0.6, yaw_deg:0 } } },
  objects: {  // この並び順がキー 1/2/3。軽い・柔らかい → 重い・硬い。spot は 1 本目の腕のローカル座標
    sponge: { label:'スポンジ',   width:60, p_gain:250,  cap_ma:120, release:2.0, mass_g:10,  bounce:0.15, color:'#facc15', kind:'box',    spot:[-0.10,0,0.12] },
    ball:   { label:'ボール',     width:45, p_gain:900,  cap_ma:350, release:1.5, mass_g:45,  bounce:0.65, color:'#ef4444', kind:'sphere', spot:[0,0,0.15] },
    block:  { label:'鉄ブロック', width:30, p_gain:2000, cap_ma:450, release:1.0, mass_g:300, bounce:0.05, color:'#94a3b8', kind:'box',    spot:[0.10,0,0.12] },
  },
  scene: { desk:{ x:0.05, y:0, z:0.05, w:0.5, d:0.4 }, sound:true, ghost:'half' },   // desk.y = 机の面の高さ（台の底から・m）。実機の指先が届く高さに物を置くために上げる
};
let CONFIG = structuredClone(DEFAULTS);
const JOINTS = ['shoulder_pan','shoulder_lift','elbow_flex','wrist_flex','wrist_roll'];
// 画面に出す関節名（根本から 1〜5 番目のサーボ＋グリッパ）。J キーで表示を切替え
const JOINT_NAMES = { shoulder_pan:'1 土台の回転', shoulder_lift:'2 肩', elbow_flex:'3 肘', wrist_flex:'4 手首の曲げ', wrist_roll:'5 手首の回転', gripper:'6 グリッパ' };
let showNames = false;
// 画面の文字（状態・キー一覧・小窓の名前）。既定は出さない＝人に見せる用。H で出す／消す、?info=1 で最初から出す
let showInfo = new URLSearchParams(location.search).get('info') === '1';
const GAP_MIN = 0.010, GAP_MAX = 0.040;                 // twin の指間隔 [m]（開き 0→100）
const gapAt = w => GAP_MIN + (GAP_MAX - GAP_MIN) * w / 100;
const REACH_MARGIN = 0.03;                              // 指先中点がこの距離まで寄れば「手の中」
const KEEPALIVE_MS = 500, G = 9.81, REST_LIFT = 0.002;
const THROW_MAX = 5.0, THROW_MIN = 0.15, VEL_WINDOW_MS = 110;
const SPECTATOR = new URLSearchParams(location.search).get('spectator') === '1';
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const armIds = () => Object.keys(CONFIG.arms);
const primaryId = () => armIds()[0];
const normToRad = (jm, name, v) => { const m = jm[name]; return m.sign * rad(v / 100 * m.span_deg / 2 + m.offset_deg); };

// ───────── 基本セットアップ ─────────
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 30);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.0));
const dir = new THREE.DirectionalLight(0xffffff, 1.2); dir.position.set(0.5, 1.5, 0.8); scene.add(dir);
const INLINE_BG = new THREE.Color(0x1e293b);
const grid = new THREE.GridHelper(4, 40, 0x64748b, 0x334155); scene.add(grid);   // 床（world y=0）

// ───────── Koch 分身（実寸・m）。腕ごとに 1 体。1 本目の腕のローカル座標が机と物体の基準 ─────────
const ARM_COLORS = { koch_leader: 0xd97706, koch_follower: 0x2563eb };
const box = (w,h,d,m) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
const cyl = (r,h,m) => new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20), m);
let arms = {};                                          // id -> twin
function nameTag(text){
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const g = c.getContext('2d'); g.fillStyle = 'rgba(15,23,42,.82)'; g.fillRect(0, 0, 512, 96);
  g.fillStyle = '#fde68a'; g.font = 'bold 44px sans-serif'; g.textBaseline = 'middle'; g.fillText(text, 16, 50);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest:false }));
  sp.scale.set(0.12, 0.0225, 1); sp.renderOrder = 10; return sp;
}
function makeArm(id, cfg){
  const mats = {
    base: new THREE.MeshStandardMaterial({ color:0xe2e8f0, roughness:.6 }),
    link: new THREE.MeshStandardMaterial({ color:0x334155, roughness:.5 }),
    joint: new THREE.MeshStandardMaterial({ color:0xf8fafc, roughness:.3 }),
    grip: new THREE.MeshStandardMaterial({ color: ARM_COLORS[cfg.model] ?? 0xd97706, roughness:.5 }),
  };
  const group = new THREE.Group(); scene.add(group);
  const base = box(0.05, 0.035, 0.05, mats.base); base.position.y = 0.0175; group.add(base);
  const jPan = new THREE.Group(); jPan.position.y = 0.035; base.add(jPan); jPan.add(cyl(0.016, 0.02, mats.joint));
  const jLift = new THREE.Group(); jLift.position.y = 0.02; jPan.add(jLift); jLift.add(cyl(0.014, 0.034, mats.joint).rotateZ(Math.PI/2));
  const upper = box(0.02, 0.11, 0.02, mats.link); upper.position.y = 0.055; jLift.add(upper);
  const jElbow = new THREE.Group(); jElbow.position.y = 0.11; jLift.add(jElbow); jElbow.add(cyl(0.013, 0.032, mats.joint).rotateZ(Math.PI/2));
  const fore = box(0.018, 0.108, 0.018, mats.link); fore.position.y = 0.054; jElbow.add(fore);
  const jWristF = new THREE.Group(); jWristF.position.y = 0.108; jElbow.add(jWristF); jWristF.add(cyl(0.011, 0.028, mats.joint).rotateZ(Math.PI/2));
  const wrist = box(0.016, 0.05, 0.016, mats.link); wrist.position.y = 0.025; jWristF.add(wrist);
  const jWristR = new THREE.Group(); jWristR.position.y = 0.05; jWristF.add(jWristR); jWristR.add(cyl(0.012, 0.016, mats.joint));
  const palm = box(0.034, 0.018, 0.02, mats.grip); palm.position.y = 0.017; jWristR.add(palm);
  const fingerL = box(0.006, 0.045, 0.012, mats.grip), fingerR = box(0.006, 0.045, 0.012, mats.grip);
  fingerL.position.set(-0.012, 0.048, 0); fingerR.position.set(0.012, 0.048, 0); jWristR.add(fingerL, fingerR);
  const tip = new THREE.Object3D(); tip.position.set(0, 0.065, 0); jWristR.add(tip);   // 指先の中点
  // 指先マーカー（AR で分身を消したときも、どこを「指先」と見ているかが分かる輪）
  const tipRing = new THREE.Mesh(new THREE.TorusGeometry(0.018, 0.003, 10, 28), new THREE.MeshBasicMaterial({ color: ARM_COLORS[cfg.model] ?? 0xd97706 }));
  tipRing.rotation.x = Math.PI/2; tipRing.position.y = 0.065; jWristR.add(tipRing);
  const meshes = []; group.traverse(o => { if (o.isMesh && o !== tipRing) meshes.push(o); });
  // 関節名の札（各関節の横。分身の見せ方 G の対象外）
  const tags = [[jPan,'shoulder_pan'],[jLift,'shoulder_lift'],[jElbow,'elbow_flex'],[jWristF,'wrist_flex'],[jWristR,'wrist_roll'],[tip,'gripper']].map(([node, j]) => {
    const t = nameTag(JOINT_NAMES[j]); t.position.set(0.085, 0, 0); node.add(t); return t; });
  return { id, cfg, group, jPan, jLift, jElbow, jWristF, jWristR, fingerL, fingerR, tip, tipRing, mats, meshes, tags,
           forced:null, lastSent:null, lastSentAt:0, sendStatus: SPECTATOR ? '観客(送信なし)' : '未送信', current:null,
           hist:[] };
}
function buildArms(){
  Object.values(arms).forEach(a => scene.remove(a.group));
  arms = {};
  for (const [id, cfg] of Object.entries(CONFIG.arms)) arms[id] = makeArm(id, cfg);
  applyBases(); buildDesk(); applyGhost();
}
function applyBases(fromUser){
  for (const a of Object.values(arms)) {
    const b = a.cfg.base; a.group.position.set(b.x, b.y, b.z); a.group.rotation.set(0, rad(b.yaw_deg), 0);
    const st = anchorState[a.id];
    if (fromUser && st && st.pose) st.off = relativePose(st.pose, baseToPose(b));   // 編集・位置合わせで台を動かした: アンカーからの差分を持ち直す
  }
  if (arms[primaryId()]) arms[primaryId()].group.updateMatrixWorld(true);
}
const prim = () => arms[primaryId()];

// ───────── 空間アンカー（AR）: 位置合わせの結果を実世界に固定し、次のセッション・付け替え・境界の引き直しの後も自動で復元 ─────────
// 「確定(保存)」でアンカーを登録し、永続ハンドルをこのブラウザ（ヘッドセット）に保存する。AR を始めるたびに復元して分身の台を置く。
// 復元できないときは従来どおり Mac の設定値（台の x/y/z/yaw）から始め、C で合わせる。URL に ?anchors=0 を付けると使わない。
const ANCHORS_ON = new URLSearchParams(location.search).get('anchors') !== '0';
const ANCHOR_KEY = id => `koch4.anchor.${id}`;
const anchorState = {};           // armId -> { anchor, uuid, pose:{p,q}|null（アンカーの最新の姿勢）, off:{p,q}（台のアンカーからの差分）, status }
const anchorReq = new Set();      // 次のフレームで登録し直す腕
let xrSession = null, anchorsOk = false;
const UP = new THREE.Vector3(0, 1, 0);
const identityOff = () => ({ p:new THREE.Vector3(), q:new THREE.Quaternion() });
function baseToPose(b){ return { p:new THREE.Vector3(b.x, b.y, b.z), q:new THREE.Quaternion().setFromAxisAngle(UP, rad(b.yaw_deg)) }; }
function yawOf(q){ return new THREE.Euler().setFromQuaternion(q, 'YXZ').y; }
function composePose(a, off){ return { p: off.p.clone().applyQuaternion(a.q).add(a.p), q: a.q.clone().multiply(off.q) }; }
function relativePose(a, w){ const qi = a.q.clone().invert(); return { p: w.p.clone().sub(a.p).applyQuaternion(qi), q: qi.clone().multiply(w.q) }; }
function readStored(id){ try { return localStorage.getItem(ANCHOR_KEY(id)); } catch(e) { return null; } }
function writeStored(id, uuid){ try { if (uuid) localStorage.setItem(ANCHOR_KEY(id), uuid); else localStorage.removeItem(ANCHOR_KEY(id)); } catch(e) { /* プライベートモードなど */ } }
function blankAnchor(status){ return { anchor:null, uuid:null, pose:null, off:identityOff(), status }; }
async function restoreAnchors(session){
  for (const id of armIds()) {
    const st = anchorState[id] = blankAnchor('');
    const uuid = readStored(id);
    if (!uuid) { st.status = 'アンカー未登録→C で位置合わせ'; continue; }
    if (typeof session.restorePersistentAnchor !== 'function') { st.status = '永続アンカー非対応→C'; continue; }
    try { st.anchor = await session.restorePersistentAnchor(uuid); st.uuid = uuid; st.status = 'アンカー復元中'; }
    catch(e) { st.status = `アンカー復元失敗(${e.message})→C`; writeStored(id, null); }
  }
}
// 毎フレーム: アンカーの姿勢に差分を掛けて台を置く。位置合わせ中は解法の結果を優先し、見失っている間は直前の姿勢のまま
function updateAnchors(frame, refOverride){
  const ref = refOverride || renderer.xr.getReferenceSpace(); if (!frame || !ref) return;
  for (const a of Object.values(arms)) {
    const st = anchorState[a.id]; if (!st || !st.anchor) continue;
    let pose = null; try { pose = frame.getPose(st.anchor.anchorSpace, ref); } catch(e) { pose = null; }
    if (!pose) { if (!st.pose) st.status = 'アンカー追跡待ち'; continue; }
    const t = pose.transform;
    st.pose = { p:new THREE.Vector3(t.position.x, t.position.y, t.position.z), q:new THREE.Quaternion(t.orientation.x, t.orientation.y, t.orientation.z, t.orientation.w) };
    if (calib.on && calib.armId === a.id) { st.status = 'アンカー(位置合わせ中)'; continue; }
    const w = composePose(st.pose, st.off);
    a.group.position.copy(w.p); a.group.quaternion.copy(w.q);
    const b = a.cfg.base; b.x = +w.p.x.toFixed(4); b.y = +w.p.y.toFixed(4); b.z = +w.p.z.toFixed(4); b.yaw_deg = +deg(yawOf(w.q)).toFixed(2);
    st.status = 'アンカー復元済み';
  }
  if (anchorReq.size) for (const id of [...anchorReq]) { anchorReq.delete(id); createAnchorFor(id, frame, ref); }
}
async function createAnchorFor(id, frame, ref){
  const a = arms[id]; if (!a) return;
  const st = anchorState[id] || (anchorState[id] = blankAnchor(''));
  const b = baseToPose(a.cfg.base);
  try {
    const xf = new XRRigidTransform({ x:b.p.x, y:b.p.y, z:b.p.z, w:1 }, { x:b.q.x, y:b.q.y, z:b.q.z, w:b.q.w });
    const anchor = await frame.createAnchor(xf, ref);
    const old = st.anchor, oldUuid = st.uuid;
    st.anchor = anchor; st.pose = b; st.off = identityOff();
    if (old && old !== anchor) { try { old.delete(); } catch(e) { /* 既に無効 */ } }
    let uuid = null;
    if (typeof anchor.requestPersistentHandle === 'function') { try { uuid = await anchor.requestPersistentHandle(); } catch(e) { st.status = `アンカー登録(このセッションだけ: ${e.message})`; } }
    else st.status = 'アンカー登録(永続化は非対応)';
    if (uuid) {
      if (oldUuid && oldUuid !== uuid && xrSession && typeof xrSession.deletePersistentAnchor === 'function') { try { await xrSession.deletePersistentAnchor(oldUuid); } catch(e) { /* 無ければよい */ } }
      st.uuid = uuid; writeStored(id, uuid); st.status = 'アンカー登録済み';
    }
  } catch(e) { st.status = `アンカー登録失敗(${e.message})`; }
}
async function clearAnchors(){
  for (const id of armIds()) {
    const st = anchorState[id];
    if (st && st.uuid && xrSession && typeof xrSession.deletePersistentAnchor === 'function') { try { await xrSession.deletePersistentAnchor(st.uuid); } catch(e) { /* 無ければよい */ } }
    if (st && st.anchor) { try { st.anchor.delete(); } catch(e) { /* 既に無効 */ } }
    writeStored(id, null);
    anchorState[id] = blankAnchor('アンカー解除→台は設定値');
  }
  applyBases();
}
function anchorText(){
  if (!renderer.xr.isPresenting || !ANCHORS_ON) return '';
  const parts = Object.values(arms).map(a => { const st = anchorState[a.id]; return st && st.status ? `${a.id}:${st.status}` : ''; }).filter(Boolean);
  return parts.length ? ' / ' + parts.join('・') : (anchorsOk ? '' : ' / アンカー非対応');
}

// ───────── 机（1 本目の腕のローカル座標。2 本目の腕の台座も載るように広げる） ─────────
let desk = null, deskRect = { x0:-0.2, x1:0.3, z0:-0.15, z1:0.25 };
const _v = new THREE.Vector3();
function buildDesk(){
  const p = prim(); if (!p) return;
  if (desk) p.group.remove(desk);
  const d = CONFIG.scene.desk;
  let x0 = d.x - d.w/2, x1 = d.x + d.w/2, z0 = d.z - d.d/2, z1 = d.z + d.d/2;
  for (const a of Object.values(arms)) {
    if (a === p) continue;
    _v.set(a.cfg.base.x, a.cfg.base.y, a.cfg.base.z); p.group.worldToLocal(_v);
    x0 = Math.min(x0, _v.x - 0.3); x1 = Math.max(x1, _v.x + 0.3); z0 = Math.min(z0, _v.z - 0.2); z1 = Math.max(z1, _v.z + 0.35);
  }
  deskRect = { x0, x1, z0, z1 };
  desk = box(x1 - x0, 0.012, z1 - z0, new THREE.MeshStandardMaterial({ color:0x475569, roughness:.8, transparent:true, opacity:0.9 }));
  desk.position.set((x0 + x1)/2, deskY() - 0.006, (z0 + z1)/2); p.group.add(desk);
}

// ───────── 仮想物体（1 本目の腕のローカル座標で物理を回す。握る→指先に付く／放す→投げられる・落ちる・跳ねる） ─────────
let objs = [];
function buildObjects(){
  const p = prim(); if (!p) return;
  objs.forEach(o => p.group.remove(o.mesh));
  objs = Object.entries(CONFIG.objects).map(([name, cfg]) => {
    const d = gapAt(cfg.width);
    const sphere = cfg.kind === 'sphere';
    const geo = sphere ? new THREE.SphereGeometry(d/2, 24, 16) : new THREE.BoxGeometry(d, d*1.2, d);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:new THREE.Color(cfg.color), roughness:.7, emissive:0x000000 }));
    p.group.add(mesh);
    const o = { name, cfg, mesh, heldBy:null, v:new THREE.Vector3(), spin:new THREE.Vector3(), asleep:true,
                r: d/2, half: sphere ? d/2 : d*0.6, drag: cfg.mass_g < 20 ? 1.2 : cfg.mass_g < 100 ? 0.25 : 0.05 };
    placeAtSpot(o);
    return o;
  });
  buildTargets();
}
// ───────── 置く的（机の上の丸）: 物体を同じ色の丸の中にそっと置けたら OK。全部置けたらクリア。B で出す／消す ─────────
// 投げ入れる遊びにすると実機を乱暴に振られるので、置く遊びにしている（ユーザー 10/5）。
const TARGET_R = 0.032;                                  // 丸の半径 [m]（物体は幅 2〜3 cm）
const TARGET_ARC = { ratio:0.65, deg:[40, 0, -40] };     // 丸の位置: 物の置き場所の平均距離 × 0.65 の弧（8〜20 cm）。物体の並びと左右を入れ替える
function targetRadius(){ const ds = objs.map(o => Math.hypot(o.cfg.spot[0], o.cfg.spot[2])); const mean = ds.reduce((s, v) => s + v, 0) / Math.max(1, ds.length); return Math.min(0.20, Math.max(0.08, TARGET_ARC.ratio * mean)); }
let targets = [], targetsOn = true, gameStart = 0, gameClear = 0;
function buildTargets(){
  const p = prim();
  targets.forEach(t => t.mesh.parent && t.mesh.parent.remove(t.mesh));
  targets = []; gameStart = gameClear = 0;
  if (!p || !targetsOn) return;
  objs.forEach((o, i) => {
    const a = rad(TARGET_ARC.deg[i % TARGET_ARC.deg.length]), r = targetRadius() + (TARGET_ARC.deg[i % TARGET_ARC.deg.length] === 0 ? -0.01 : 0.01);
    const mesh = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.RingGeometry(TARGET_R - 0.005, TARGET_R, 40), new THREE.MeshBasicMaterial({ color:new THREE.Color(o.cfg.color), side:THREE.DoubleSide }));
    const disc = new THREE.Mesh(new THREE.CircleGeometry(TARGET_R - 0.005, 40), new THREE.MeshBasicMaterial({ color:new THREE.Color(o.cfg.color), transparent:true, opacity:.22, side:THREE.DoubleSide }));
    ring.rotation.x = disc.rotation.x = -Math.PI/2; mesh.add(ring, disc);
    mesh.position.set(r * Math.sin(a), deskY() + 0.002, r * Math.cos(a));
    p.group.add(mesh);
    targets.push({ o, mesh, ring, disc, ok:false });
  });
}
function chime(freqs){
  if (!CONFIG.scene.sound || !actx) return;
  freqs.forEach((f, i) => { const t = actx.currentTime + i * 0.09, g = actx.createGain(); g.connect(actx.destination);
    g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    const osc = actx.createOscillator(); osc.type = 'triangle'; osc.frequency.setValueAtTime(f, t); osc.connect(g); osc.start(t); osc.stop(t + 0.22); });
}
function stepTargets(){
  if (!targets.length) return;
  const now = performance.now();
  if (!gameStart && objs.some(o => o.heldBy)) gameStart = now;          // 最初に何かを握ったら計時開始
  for (const t of targets) {
    const pos = t.o.mesh.position;
    const inside = Math.hypot(pos.x - t.mesh.position.x, pos.z - t.mesh.position.z) < TARGET_R - 0.004;
    const resting = !t.o.heldBy && t.o.asleep && pos.y - t.o.half - deskY() < 0.012;   // 放して、机の上で止まっている
    const ok = inside && resting;
    if (ok && !t.ok) chime([660, 990]);
    t.ok = ok;
    const col = ok ? 0x22c55e : new THREE.Color(t.o.cfg.color).getHex();
    t.ring.material.color.setHex(col); t.disc.material.color.setHex(col); t.disc.material.opacity = ok ? 0.55 : 0.22;
  }
  const done = targets.every(t => t.ok);
  if (done && !gameClear && gameStart) { gameClear = now; chime([660, 880, 1100, 1320]); }
  if (!done && gameClear && objs.every(o => !targets.find(t => t.o === o).ok)) { gameStart = gameClear = 0; }   // 全部どかしたら次の回
}
// 腕なしで確かめる: ?demo=place で開くと、1.2 秒後に全部の物体を丸の少し上から落とす
if (new URLSearchParams(location.search).get('demo') === 'place') setTimeout(() => {
  gameStart = performance.now();
  for (const t of targets) { t.o.heldBy = null; t.o.asleep = false; t.o.v.set(0, 0, 0); t.o.spin.set(0, 0, 0); t.o.mesh.position.set(t.mesh.position.x, t.o.half + 0.03, t.mesh.position.z); }
}, 1200);
function targetHud(){
  if (!targets.length) return '';
  const n = targets.filter(t => t.ok).length;
  const marks = targets.map(t => `${t.ok ? '✅' : '⬜'}${t.o.cfg.label}`).join(' ');
  const time = gameClear ? ` <b>クリア！ ${((gameClear - gameStart) / 1000).toFixed(1)} 秒</b>` : gameStart ? ` ${((performance.now() - gameStart) / 1000).toFixed(0)} 秒` : '';
  return `<br><b>置けた数 ${n}/${targets.length}</b> ${marks}${time}` + (showInfo ? '（同じ色の丸の中に置く）' : '');
}
function placeAtSpot(o){ o.mesh.position.set(o.cfg.spot[0], deskY() + o.half + REST_LIFT, o.cfg.spot[2]); o.mesh.rotation.set(0,0,0); o.heldBy = null; o.v.set(0,0,0); o.spin.set(0,0,0); o.asleep = true; o.mesh.scale.set(1,1,1); }
function resetPlacement(){ gameStart = gameClear = 0; objs.forEach(placeAtSpot); Object.values(arms).forEach(a => setForced(a, null)); }

// ───────── 音（Web Audio・物が当たったとき。重いほど低く、速いほど大きい） ─────────
let actx = null;
function unlockAudio(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); }
function thud(o, speed){
  if (!CONFIG.scene.sound || !actx || speed < 0.25) return;
  const t = actx.currentTime, m = o.cfg.mass_g;
  const gain = actx.createGain(); gain.connect(actx.destination);
  const vol = Math.min(0.9, 0.12 + speed * 0.25) * (m < 20 ? 0.35 : 1);
  gain.gain.setValueAtTime(vol, t); gain.gain.exponentialRampToValueAtTime(0.001, t + (m > 100 ? 0.25 : 0.12));
  const osc = actx.createOscillator(); osc.type = m > 100 ? 'triangle' : 'sine';
  const f0 = m > 100 ? 110 : m < 20 ? 180 : 520;
  osc.frequency.setValueAtTime(f0 * 1.6, t); osc.frequency.exponentialRampToValueAtTime(f0, t + 0.06);
  osc.connect(gain); osc.start(t); osc.stop(t + 0.3);
  if (m > 100 || m < 20) {   // 鉄とスポンジにはノイズを少し重ねる（鉄=ガチャ・スポンジ=ふす）
    const n = actx.createBufferSource(); const buf = actx.createBuffer(1, 2205, actx.sampleRate); const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
    n.buffer = buf; const ng = actx.createGain(); ng.gain.setValueAtTime(vol * (m > 100 ? 0.5 : 0.15), t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    n.connect(ng); ng.connect(actx.destination); n.start(t);
  }
}

// ───────── 物理（簡易剛体: 重力・空気抵抗・机／床との衝突・反発と摩擦・球同士の衝突） ─────────
function floorY(){ const p = prim(); return p ? -p.cfg.base.y : -0.75; }      // world y=0 を 1 本目ローカルで
const deskY = () => +(CONFIG.scene.desk.y || 0);                               // 机の面の高さ（1 本目ローカル）
function onDesk(x, z){ return x >= deskRect.x0 && x <= deskRect.x1 && z >= deskRect.z0 && z <= deskRect.z1; }
function stepPhysics(o, dt){
  if (o.heldBy || o.asleep) return;
  o.v.y -= G * dt;
  o.v.multiplyScalar(Math.max(0, 1 - o.drag * dt));
  o.mesh.position.addScaledVector(o.v, dt);
  o.mesh.rotation.x += o.spin.x * dt; o.mesh.rotation.y += o.spin.y * dt; o.mesh.rotation.z += o.spin.z * dt;
  const pos = o.mesh.position;
  const ground = onDesk(pos.x, pos.z) ? deskY() : floorY();
  if (pos.y - o.half <= ground && o.v.y <= 0) {
    const speed = Math.abs(o.v.y);
    pos.y = ground + o.half;
    const bounce = o.cfg.bounce * (ground === deskY() ? 1 : 0.8);
    o.v.y = speed > 0.3 ? speed * bounce : 0;
    o.v.x *= 0.6; o.v.z *= 0.6; o.spin.multiplyScalar(0.5);
    if (speed > 0.3) thud(o, speed);
    if (o.v.y === 0) {   // 滑って止まる
      const h = Math.hypot(o.v.x, o.v.z);
      if (h < 0.05) { o.v.set(0,0,0); o.spin.set(0,0,0); o.asleep = true; o.mesh.rotation.x = o.mesh.rotation.z = 0; }
    }
  }
  if (pos.y < floorY() - 1) placeAtSpot(o);   // 机からも床からも落ちた（あり得ないが保険）
}
const _n = new THREE.Vector3(), _rel = new THREE.Vector3();
function collideObjects(){
  for (let i = 0; i < objs.length; i++) for (let j = i + 1; j < objs.length; j++) {
    const a = objs[i], b = objs[j];
    if (a.heldBy && b.heldBy) continue;
    _n.subVectors(b.mesh.position, a.mesh.position); const dist = _n.length(), minD = a.r + b.r;
    if (dist <= 1e-6 || dist >= minD) continue;
    _n.divideScalar(dist);
    const ma = a.heldBy ? 1e9 : a.cfg.mass_g, mb = b.heldBy ? 1e9 : b.cfg.mass_g;
    const push = (minD - dist);
    if (!a.heldBy) a.mesh.position.addScaledVector(_n, -push * mb / (ma + mb));
    if (!b.heldBy) b.mesh.position.addScaledVector(_n,  push * ma / (ma + mb));
    _rel.subVectors(b.v, a.v); const vn = _rel.dot(_n);
    if (vn < 0) {
      const e = Math.min(a.cfg.bounce, b.cfg.bounce) * 0.8 + 0.1;
      const jimp = -(1 + e) * vn / (1/ma + 1/mb);
      if (!a.heldBy) { a.v.addScaledVector(_n, -jimp / ma); a.asleep = false; }
      if (!b.heldBy) { b.v.addScaledVector(_n,  jimp / mb); b.asleep = false; }
      thud(a.cfg.mass_g > b.cfg.mass_g ? a : b, Math.abs(vn));
    }
  }
}
// 放した瞬間の速度 = 直前 ~110 ms の指先位置の差分（ローカル座標）
function releaseVelocity(arm){
  const h = arm.hist; const now = h.length ? h[h.length-1].t : 0;
  let k = h.length - 1; while (k > 0 && now - h[k].t < VEL_WINDOW_MS) k--;
  if (h.length < 2 || k === h.length - 1) return new THREE.Vector3();
  const dt = (now - h[k].t) / 1000; if (dt <= 0) return new THREE.Vector3();
  const v = h[h.length-1].p.clone().sub(h[k].p).divideScalar(dt);
  if (v.length() > THROW_MAX) v.setLength(THROW_MAX);
  if (v.length() < THROW_MIN) v.set(0, 0, 0);
  return v;
}

// ───────── /config ・ /state ─────────
function adoptConfig(cfg){
  if (!cfg || typeof cfg !== 'object') return;
  if (!cfg.arms) { // 旧形式(v1): joints/base が最上位
    cfg = { version:2, arms:{ B:{ label:'リーダー', model:'koch_leader', joints: cfg.joints ?? structuredClone(DEFAULT_JOINTS), base: cfg.base ?? structuredClone(DEFAULTS.arms.B.base) } },
            objects: cfg.objects ?? structuredClone(DEFAULTS.objects), scene: structuredClone(DEFAULTS.scene) };
  }
  cfg.scene = Object.assign(structuredClone(DEFAULTS.scene), cfg.scene || {});
  for (const o of Object.values(cfg.objects || {})) if (o.bounce === undefined) o.bounce = 0.3;
  CONFIG = cfg;
  if (!CONFIG.arms[selArm]) selArm = primaryId();
  buildArms(); buildObjects(); buildEditor(); buildButtons();
}
async function loadConfig(){
  try { const r = await fetch('/config', { cache:'no-store' }); if (r.ok) { noteConfigVersion(r); adoptConfig(await r.json()); } }
  catch(e) { /* サーバなし=既定値 */ }
}
function noteConfigVersion(r){ const v = r.headers.get('X-Config-Version'); if (v !== null && v !== '') cfgVersion = +v; }
let st = null, lastOk = -1e9;
// 設定の版（ブリッジが保存ごとに +1）: 別のページ（Mac の操作ページ）が保存したら読み直す。操作キュー: Mac から届いた操作を 1 回ずつ実行
let cfgVersion = null, lastOpId = null, opSynced = false;
async function poll(){
  try { const r = await fetch('/state', { cache:'no-store' }); if (r.ok) { st = await r.json(); lastOk = performance.now(); followBridge(st); } }
  catch(e) { /* サーバなし=デモ継続 */ }
}
function followBridge(s){
  if (s.cfg_version !== undefined) {
    if (cfgVersion === null) cfgVersion = s.cfg_version;
    else if (s.cfg_version !== cfgVersion) { cfgVersion = s.cfg_version; loadConfig(); }
  }
  const op = s.op;
  if (!opSynced) { lastOpId = op ? op.id : null; opSynced = true; return; }   // 開いた時点より前の操作は実行しない
  if (op && op.id !== lastOpId) { lastOpId = op.id; runOp(op); }
}
setInterval(poll, 33);
loadConfig();

// ───────── 接触判定 → /contact 送信（腕ごと・変化時＋キープアライブ。観客モードは送らない） ─────────
const tipW = new THREE.Vector3(), objW = new THREE.Vector3(), tipL = new THREE.Vector3();
function nearestObject(arm){
  arm.tip.getWorldPosition(tipW);
  let best = null, bestD = Infinity;
  objs.forEach(o => {
    if (o.heldBy && o.heldBy !== arm.id) return;          // 他の腕が握っている物は候補にしない
    o.mesh.getWorldPosition(objW);
    const d = tipW.distanceTo(objW) - o.r;
    if (d < REACH_MARGIN && d < bestD) { best = o; bestD = d; }
  });
  return best;
}
async function sendContact(arm, o, force){
  if (SPECTATOR) return;
  const c = o ? o.cfg : null;
  const payload = c ? { name:o.name, width:c.width, p_gain:c.p_gain, cap_ma:c.cap_ma, release:c.release, mass_g:c.mass_g } : null;
  const key = JSON.stringify(payload);
  const now = performance.now();
  if (!force && key === arm.lastSent && now - arm.lastSentAt < KEEPALIVE_MS) return;
  arm.lastSent = key; arm.lastSentAt = now;
  try { const r = await fetch('/contact', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ arm: arm.id, vwall: payload }) });
        arm.sendStatus = r.ok ? `送信OK ${new Date().toLocaleTimeString()}` : `HTTP ${r.status}`; }
  catch(e) { arm.sendStatus = '送信失敗(サーバなし)'; }
}

// ───────── 1 フレーム: 姿勢を当てる → 接触 → 握る/放す/投げる → 物理 → HUD ─────────
const hudMode = document.getElementById('mode');
const alertBox = document.getElementById('alert');
let lastFrame = 0, selArm = 'B';
function armState(id, tms){
  const live = st && performance.now() - lastOk < 2000;
  const s = live ? (st.arms ? st.arms[id] : (id === primaryId() ? st : null)) : null;
  if (s && s.src !== undefined) return { pos: s.pos || {}, open: s.open ?? 100, vwall: s.vwall, vw: s.vw, vwUnit: s.vw_unit || {}, src: s.src, alerts: s.alerts || [], live:true };
  const t = tms / 1000, ph = Object.keys(arms).indexOf(id) * 1.7;
  return { pos: { shoulder_pan:40*Math.sin(t*.6+ph), shoulder_lift:45*Math.sin(t*.8+ph)+25, elbow_flex:50*Math.sin(t*.7+1+ph), wrist_flex:40*Math.sin(t*.9+2+ph), wrist_roll:60*Math.sin(t*.5+ph) },
           open: 50 + 50*Math.sin(t*1.2+ph), vwall:null, vw:null, vwUnit:{}, src:'demo', alerts:[], live:false };
}
function applyPose(tms){
  const dt = Math.min(0.05, (tms - lastFrame) / 1000 || 0.016); lastFrame = tms;
  const p = prim(); if (!p) return;
  const lines = [], alerts = [];
  const liveAny = st && performance.now() - lastOk < 2000;
  if (!liveAny) alerts.push('⚠ テレオペ／ブリッジと未接続');
  for (const arm of Object.values(arms)) {
    const s = armState(arm.id, tms), jm = arm.cfg.joints;
    arm.jPan.rotation.y = normToRad(jm, 'shoulder_pan', s.pos.shoulder_pan ?? 0);
    arm.jLift.rotation.x = normToRad(jm, 'shoulder_lift', s.pos.shoulder_lift ?? 0);
    arm.jElbow.rotation.x = normToRad(jm, 'elbow_flex', s.pos.elbow_flex ?? 0);
    arm.jWristF.rotation.x = normToRad(jm, 'wrist_flex', s.pos.wrist_flex ?? 0);
    arm.jWristR.rotation.y = normToRad(jm, 'wrist_roll', s.pos.wrist_roll ?? 0);
    const half = gapAt(s.open) / 2; arm.fingerL.position.x = -half; arm.fingerR.position.x = half;
    const tagsOn = showNames && !renderer.xr.isPresenting && inlineView !== 'macro' && inlineView !== 'hand';   // 接写・手先カメラでは名札が邪魔
    for (const t of arm.tags) t.visible = tagsOn;
    arm.group.updateMatrixWorld(true);
    // 指先の位置（1 本目ローカル）と履歴（投げる速度用）
    arm.tip.getWorldPosition(tipW); p.group.worldToLocal(tipL.copy(tipW));
    arm.hist.push({ t: tms, p: tipL.clone() }); while (arm.hist.length > 12) arm.hist.shift();
    // 接触候補: 手動強制 > 近接
    arm.current = arm.forced ?? nearestObject(arm);
    sendContact(arm, arm.current, false);
    // 握る／放す
    for (const o of objs) {
      const engaged = !!(s.vwall && s.vwall.engaged && s.vwall.name === o.name && (!o.heldBy || o.heldBy === arm.id));
      if (engaged) { o.heldBy = arm.id; o.asleep = true; o.v.set(0,0,0); o.mesh.position.copy(tipL); o.mesh.rotation.set(0, arm.jPan.rotation.y, 0); }
      else if (o.heldBy === arm.id) {     // 放した: 直前の指先速度で飛ぶ
        o.heldBy = null; o.asleep = false; o.v.copy(releaseVelocity(arm));
        const sp = o.v.length(); o.spin.set((Math.random()-.5)*sp*6, (Math.random()-.5)*sp*6, (Math.random()-.5)*sp*6);
        o.mesh.scale.set(1,1,1);
      }
      if (o.heldBy === arm.id) { const pen = Math.min(0.5, Math.max(0, (o.cfg.width - s.open) / o.cfg.width)); o.mesh.scale.set(1 - 0.6*pen, 1 + 0.3*pen, 1); }
    }
    if (s.live && s.src === 'none') alerts.push(`⚠ 腕 ${arm.id}: テレオペが止まっています（分身は最後の姿勢）`);
    alerts.push(...s.alerts.map(a => (Object.keys(arms).length > 1 ? `[${arm.id}] ` : '') + a));
    const c = arm.current ? arm.current.cfg : null;
    const held = objs.find(o => o.heldBy === arm.id);
    const objTxt = held ? `<b>${held.cfg.label} を握っている</b>` : c ? `${c.label}(幅${c.width}・P${c.p_gain}・上限${c.cap_ma}mA・${c.mass_g}g)` : 'なし(自由空間)';
    const vwTxt = s.vw ? ` / 重さ ${Object.entries(s.vw).map(([j,v]) => `${j === 'shoulder_lift' ? '肩' : '肘'}${v}${s.vwUnit[j] || 'mA'}`).join('・')}` : '';
    const srcTxt = s.src === 'teleop' ? '実機' : s.src === 'sim' ? 'シミュレータ' : s.src === 'demo' ? '内蔵デモ' : '停止中';
    lines.push(`<span class="arm">${arm.id === selArm ? '▶' : '　'}${arm.id} ${arm.cfg.label}</span> ${srcTxt} 開き ${s.open.toFixed(0)} / ${objTxt}${vwTxt}` + (arm.forced ? ' <b>強制</b>' : '') + (SPECTATOR ? '' : ` / ${arm.sendStatus}`));
    if (showNames && arm.id === (arms[selArm] ? selArm : primaryId())) {   // 関節ごとの読み値と分身の角度
      for (const j of JOINTS) { const v = s.pos[j] ?? 0; lines.push(`　${JOINT_NAMES[j]} <span style="color:#94a3b8">${j}</span>: 読み値 ${v.toFixed(1)} → 分身 ${(normToRad(jm, j, v) * 180 / Math.PI).toFixed(0)}°`); }
    }
  }
  for (const o of objs) stepPhysics(o, dt);

    const cand = Object.values(arms).some(a => a.current && a.current.name === o.name);

      + (st.page.calib_on ? ` / <b>位置合わせ中 ${st.page.points} 点${st.page.residual_cm != null ? ` ずれ ${st.page.residual_cm} cm` : ''}</b>` : '')
      + (st.page.anchor ? ` / ${st.page.anchor}` : '') + (st.page.grab ? ' / <b>つかんで移動中</b>' : '')
    : '<span class="arm">ゴーグル</span> 報告なし（ページが開いていない）');
  const view = renderer.xr.isPresenting ? (arActive ? 'AR(パススルー)' : 'VR') : VIEW_NAMES[inlineView];
  const hudBox = document.getElementById('hud');
  if (!showInfo) {   // 見せる用: 置けた数だけ（的を消していれば何も出さない）
    const t = targetHud().replace(/^<br>/, '');
    hudBox.style.display = t ? 'block' : 'none'; hudBox.firstChild.textContent = ''; hudBox.querySelector('br').style.display = 'none';
    hudMode.innerHTML = t; return;
  }
  hudBox.style.display = 'block'; hudBox.firstChild.textContent = 'Koch4 XR'; hudBox.querySelector('br').style.display = '';
  hudMode.innerHTML = lines.join('<br>') + `<br>表示: ${view}${anchorText()}` + (calib.on ? ' / <b>位置合わせ中</b>' : '') + (SPECTATOR ? ' / <b>観客モード</b>' : '')
    + (renderer.xr.isPresenting ? '' : ` / 画面: ${LAYOUT_NAMES[layout]}`)
    + targetHud()
    + `<br>キー: 1-3 強制 0 解除 R 配置 E 編集 C 位置合わせ G 分身の見せ方 V 視点 M 画面の割り方 J 関節名 B 置く的 H 文字を消す S 音 Tab 腕切替`;
}

// ───────── インラインの視点: 一人称（モニタ向け・既定）／俯瞰オービット ─────────
// V で切替え。URL に ?view=top のように書くと、その視点で開く（モニタを並べるとき。観客ページ ?spectator=1 と併用）
const VIEW_NAMES = { fps:'一人称(モニタ用)', hand:'手先カメラ', top:'俯瞰(真上・固定)', macro:'接写(物体の前・固定)', orbit:'俯瞰(ドラッグで回す)' };
const VIEW_ORDER = ['fps', 'hand', 'top', 'macro', 'orbit'];
const viewParam = new URLSearchParams(location.search).get('view');
let inlineView = VIEW_ORDER.includes(viewParam) ? viewParam : 'fps';
const camTip = new THREE.Vector3(), camGoal = new THREE.Vector3(), camLook = new THREE.Vector3();
// 画面の割り方（M で切替え・?layout=）: pip=主画面＋右に小窓 2 つ（手先カメラ・接写） / split=手先カメラと接写を左右に / single=主画面だけ
const LAYOUT_NAMES = { pip:'主画面＋小窓(手先カメラ・接写)', split:'手先カメラ｜接写', single:'1 画面' };
const LAYOUT_ORDER = ['pip', 'split', 'single'];
const layoutParam = new URLSearchParams(location.search).get('layout');
let layout = LAYOUT_ORDER.includes(layoutParam) ? layoutParam : (viewParam ? 'single' : 'pip');
const camTop = new THREE.PerspectiveCamera(60, 1, 0.01, 30), camMacro = new THREE.PerspectiveCamera(60, 1, 0.01, 30);
const paneA = document.getElementById('paneA'), paneB = document.getElementById('paneB');
function drawPane(cam, view, pane, x, y, w, h){   // x,y は左下原点（three.js の viewport）
  cam.aspect = w / h; cam.updateProjectionMatrix(); placeCam(cam, view);
  renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.setScissorTest(true);
  renderer.render(scene, cam);
  pane.style.display = 'block'; pane.style.left = x + 'px'; pane.style.top = (innerHeight - y - h) + 'px'; pane.style.width = w + 'px'; pane.style.height = h + 'px';
  pane.firstChild.textContent = VIEW_NAMES[view]; pane.firstChild.style.display = showInfo ? '' : 'none';
}
function renderInline(){
  const W = innerWidth, H = innerHeight;
  renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
  paneA.style.display = paneB.style.display = 'none';
  if (layout === 'split') {
    const w = Math.floor(W / 2);
    setTags(false); drawPane(camTop, 'hand', paneA, 0, 0, w, H); drawPane(camMacro, 'macro', paneB, w, 0, W - w, H); setTags(null);
    renderer.setScissorTest(false); return;
  }
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  if (layout === 'pip') {
    const w = Math.round(Math.min(W * 0.30, 420)), h = Math.round(w * 0.68), m = 10;
    setTags(false); drawPane(camTop, 'hand', paneA, W - w - m, H - h - m, w, h); drawPane(camMacro, 'macro', paneB, W - w - m, H - 2*h - 2*m, w, h); setTags(null);
    renderer.setScissorTest(false);

let tagsWere = true;
function setTags(on){   // 小窓では名札を出さない（null で元に戻す）
  for (const a of Object.values(arms)) for (const t of a.tags) { if (on === null) t.visible = tagsWere; else { tagsWere = t.visible; t.visible = on; } }
}
let yaw = 0.6, pitch = 0.35, dist = 0.9, dragging = false, px = 0, py = 0;
function updateCam(){ placeCam(camera, inlineView); }
function placeCam(camera, inlineView){   // 指定のカメラを、指定の視点に置く（主画面と小窓で共用）
  camera.up.set(0, 1, 0);
  const p = prim(); const b = p ? p.cfg.base : { x:0, y:0.75, z:-0.6, yaw_deg:0 };
  if (inlineView === 'fps') {   // 操作者の頭の位置から: 台座の後ろ 40 cm・上 40 cm に立ち、腕が伸びる向き（腕のローカル +z）を見る
    const yawR = rad(b.yaw_deg), fx = Math.sin(yawR), fz = Math.cos(yawR);
    camera.position.set(b.x - 0.40*fx, b.y + 0.40, b.z - 0.40*fz);
    camera.lookAt(b.x + 0.20*fx, b.y + 0.05, b.z + 0.20*fz);
    return;
  }
  if (inlineView === 'top') {   // 真上から・固定（動くと酔う）。台座の 15 cm 先を中心に、腕が伸びる向きが画面の上
    const yawR = rad(b.yaw_deg), fx = Math.sin(yawR), fz = Math.cos(yawR);
    camera.up.set(fx, 0, fz);
    camera.position.set(b.x + 0.15*fx, b.y + 0.75, b.z + 0.15*fz);
    camera.lookAt(b.x + 0.15*fx, b.y, b.z + 0.15*fz);
    return;
  }
  if (inlineView === 'hand' && p) {   // 手先カメラ: 手の甲の少し上・後ろから指先の先を見る（手首と一緒に動く）
    p.group.updateMatrixWorld(true);
    camGoal.set(0, -0.03, -0.05); camLook.set(0, 0.16, 0.01); camTip.set(0, 0, -1);
    p.jWristR.localToWorld(camGoal); p.jWristR.localToWorld(camLook); camTip.transformDirection(p.jWristR.matrixWorld);
    camera.up.copy(camTip); camera.position.copy(camGoal); camera.lookAt(camLook);
    return;
  }
  if (inlineView === 'macro' && p && objs.length) {   // 物体の向こう側の低い位置に固定して、近づく指先を正面から
    camLook.set(0, 0, 0);
    for (const o of objs) { camLook.x += o.cfg.spot[0] / objs.length; camLook.z += o.cfg.spot[2] / objs.length; }
    const back = 0.20 * Math.max(1, 1.3 / camera.aspect);   // 縦長の枠では少し引いて、物体が全部入るように
    camGoal.set(camLook.x, 0.08 * back / 0.20, camLook.z + back); camLook.y = 0.035;
    p.group.localToWorld(camGoal); p.group.localToWorld(camLook);

    return;
  }
  const target = new THREE.Vector3(b.x, b.y + 0.1, b.z + 0.05);
  camera.position.set(target.x + dist*Math.cos(pitch)*Math.sin(yaw), target.y + dist*Math.sin(pitch), target.z + dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(target);
}
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; unlockAudio(); });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging || renderer.xr.isPresenting) return;
  if (inlineView !== 'orbit') return;
  yaw -= (e.clientX - px) * 0.005; pitch = Math.min(1.4, Math.max(-0.2, pitch + (e.clientY - py) * 0.005));
  px = e.clientX; py = e.clientY; updateCam();
});
renderer.domElement.addEventListener('wheel', e => { dist = Math.min(3, Math.max(0.3, dist + e.deltaY * 0.001)); updateCam(); });

// ───────── 分身の見せ方（AR で実機が見えているときは半透明か指先だけ） ─────────
function applyGhost(){
  const mode = arActive ? (CONFIG.scene.ghost || 'half') : 'solid';
  for (const a of Object.values(arms)) {
    for (const m of a.meshes) { m.visible = mode !== 'tips'; m.material.transparent = mode === 'half'; m.material.opacity = mode === 'half' ? 0.35 : 1; }
    a.tipRing.visible = arActive;
  }
}
function cycleGhost(){ const order = ['solid','half','tips']; CONFIG.scene.ghost = order[(order.indexOf(CONFIG.scene.ghost || 'half') + 1) % 3]; applyGhost(); }

// ───────── 位置合わせ（C）: コントローラの先端（か手の人差し指先）を実機の指先に当ててトリガー ─────────
// 1 点目=位置（台の x/y/z）、2 点目以降=向き（yaw）も最小二乗で。姿勢を変えて 2〜3 点取る。
const calib = { on:false, armId:null, points:[], markers:[], tipOffset:0.0 };
const calibBox = document.getElementById('calib');
function startCalib(){
  if (SPECTATOR) return;
  calib.on = true; calib.armId = selArm; calib.points = []; clearCalibMarkers();
  const st = anchorState[selArm];   // 中止したときにアンカーからの差分を戻せるように控える
  calib.savedOff = st && st.off ? { p: st.off.p.clone(), q: st.off.q.clone() } : null;
  showCalib(); buildButtons();
}
function stopCalib(save){
  calib.on = false; calibBox.style.display = 'none'; clearCalibMarkers();
  if (!save && calib.savedOff && anchorState[calib.armId]) anchorState[calib.armId].off = calib.savedOff;
  calib.savedOff = null;
  if (save) saveConfig(); buildButtons();
}
function clearCalibMarkers(){ calib.markers.forEach(m => scene.remove(m)); calib.markers = []; }
function showCalib(){
  const n = calib.points.length;
  const arm = arms[calib.armId];
  const res = n >= 2 ? `　ずれ ${(calibResidual(arm) * 100).toFixed(1)} cm` : '';
  calibBox.style.display = 'block';
  calibBox.innerHTML = `<b>位置合わせ: 腕 ${calib.armId}（${arm ? arm.cfg.label : ''}）</b><br>`
    + `実機の<b>指先の中点</b>にコントローラの先端（か人差し指の先）を当てて<b>トリガー</b>。`
    + `腕の姿勢を変えて 2〜3 点取る。<br>取得 ${n} 点${res}　|　<b>確定</b>で保存・<b>取消</b>で 1 点戻す・<b>中止</b>`;
}
function captureCalibPoint(worldPos){
  const arm = arms[calib.armId]; if (!arm) return;
  arm.tip.getWorldPosition(tipW); const q = arm.group.worldToLocal(tipW.clone());   // 指先の腕ローカル位置（台の推定に依存しない）
  calib.points.push({ p: worldPos.clone(), q });
  const mk = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8), new THREE.MeshBasicMaterial({ color:0x60a5fa })); mk.position.copy(worldPos); scene.add(mk); calib.markers.push(mk);
  solveCalib(arm); showCalib();
}
function undoCalibPoint(){ if (!calib.points.length) return; calib.points.pop(); const mk = calib.markers.pop(); if (mk) scene.remove(mk); const arm = arms[calib.armId]; if (calib.points.length && arm) solveCalib(arm); showCalib(); }
// three.js の rotation.y=θ: x' = x cosθ + z sinθ, z' = −x sinθ + z cosθ
function rotY(v, th){ return new THREE.Vector3(v.x*Math.cos(th) + v.z*Math.sin(th), v.y, -v.x*Math.sin(th) + v.z*Math.cos(th)); }
function solveCalib(arm){
  const pts = calib.points; if (!pts.length) return;
  const b = arm.cfg.base;
  let th = rad(b.yaw_deg);
  if (pts.length >= 2) {
    const pc = new THREE.Vector3(), qc = new THREE.Vector3();
    pts.forEach(({p, q}) => { pc.add(p); qc.add(q); }); pc.divideScalar(pts.length); qc.divideScalar(pts.length);
    let sn = 0, cs = 0;
    pts.forEach(({p, q}) => { const a = q.clone().sub(qc), bb = p.clone().sub(pc); sn += a.z*bb.x - a.x*bb.z; cs += a.x*bb.x + a.z*bb.z; });
    if (Math.hypot(sn, cs) > 1e-6) th = Math.atan2(sn, cs);

  const pc = new THREE.Vector3(), rq = new THREE.Vector3();
  pts.forEach(({p, q}) => { pc.add(p); rq.add(rotY(q, th)); }); pc.divideScalar(pts.length); rq.divideScalar(pts.length);
  b.x = +(pc.x - rq.x).toFixed(4); b.y = +(pc.y - rq.y).toFixed(4); b.z = +(pc.z - rq.z).toFixed(4); b.yaw_deg = +deg(th).toFixed(2);

}
function calibResidual(arm){
  const b = arm.cfg.base, th = rad(b.yaw_deg); let s = 0;
  calib.points.forEach(({p, q}) => { const w = rotY(q, th).add(new THREE.Vector3(b.x, b.y, b.z)); s += w.distanceToSquared(p); });
  return Math.sqrt(s / Math.max(1, calib.points.length));

// 自己診断（デスクトップのコンソールで koch4SelfTest()）: 既知の台から点を作って解き直す
window.koch4SelfTest = function(){
  const arm = prim(); const truth = { x:0.31, y:0.72, z:-0.55, yaw_deg:-37 };
  const qs = [new THREE.Vector3(0.1, 0.25, 0.15), new THREE.Vector3(-0.12, 0.2, 0.22), new THREE.Vector3(0.05, 0.3, -0.08)];
  calib.points = qs.map(q => ({ q: q.clone(), p: rotY(q, rad(truth.yaw_deg)).add(new THREE.Vector3(truth.x, truth.y, truth.z)) }));
  const keep = structuredClone(arm.cfg.base);
  arm.cfg.base = { x:0, y:0.75, z:-0.6, yaw_deg:0 }; solveCalib(arm);
  const got = structuredClone(arm.cfg.base), res = calibResidual(arm);
  arm.cfg.base = keep; calib.points = []; applyBases(); buildDesk();
  const ok = Math.abs(got.x-truth.x) < 1e-3 && Math.abs(got.y-truth.y) < 1e-3 && Math.abs(got.z-truth.z) < 1e-3 && Math.abs(got.yaw_deg-truth.yaw_deg) < 0.05 && res < 1e-3;
  return { ok, got, truth, residual_m: res };
};

// ───────── XR 入力（コントローラ／ハンド）: 位置合わせの点取りと、分身をつかんで動かす。制御はしない ─────────
// Quest Browser は AR 中に DOM overlay（ボタン・文字）を描かない（10/19 実機）。AR 中の操作はこの 2 つと音だけ:
//   位置合わせ中（Mac の C か キー C）: トリガー／つまむ = 点を 1 つ取る（音 1 つ）
//   それ以外: 分身の近くでグリップを握る／トリガー長押し／つまんだまま = 台が手に貼り付いて動く（平行移動＋yaw・音 1 つ）。
//            離すと音 2 つ、1.5 秒後に保存＝アンカー登録（音 3 つ）
const GRAB_RADIUS = 0.35;            // 分身のどこか（台・関節・指先）からこの距離以内でつかみ始めたときだけ動かす [m]
const GRAB_SAVE_DELAY_MS = 1500;     // 離してから保存するまで（続けて直すときに保存を連打しない）
const grab = { armId:null, ctrl:null, rel:null, moved:false, saveTimer:0 };
function inputPose(c){   // 入力装置の「位置＋yaw だけ」の姿勢。手なら人差し指の先と手首の向き、コントローラなら光線の起点と向き
  const h = c.userData.hand, src = c.userData.src, joints = src && src.hand && h && h.joints ? h.joints : null;
  const posNode = (joints && joints['index-finger-tip']) || c, rotNode = (joints && joints['wrist']) || c;
  const p = new THREE.Vector3(); posNode.getWorldPosition(p);
  const q = rotNode.getWorldQuaternion(new THREE.Quaternion());
  return { p, q: new THREE.Quaternion().setFromAxisAngle(UP, yawOf(q)) };
}
function distToArm(arm, p){   // 入力装置から分身までの距離（台・各関節・指先のうち最も近いもの）
  const v = new THREE.Vector3(); let d = Infinity;
  for (const node of [arm.group, arm.jLift, arm.jElbow, arm.jWristF, arm.jWristR, arm.tip]) { node.getWorldPosition(v); d = Math.min(d, v.distanceTo(p)); }
  return d;
}
function startGrab(c){
  if (SPECTATOR || calib.on || grab.ctrl || !renderer.xr.isPresenting) return;
  const hp = inputPose(c); let best = null, bd = GRAB_RADIUS;
  for (const a of Object.values(arms)) { const d = distToArm(a, hp.p); if (d < bd) { bd = d; best = a; } }
  if (!best) return;
  clearTimeout(grab.saveTimer);
  grab.armId = best.id; grab.ctrl = c; grab.rel = relativePose(hp, baseToPose(best.cfg.base)); grab.moved = false;
  chime([520]);
}
function updateGrab(){   // 毎フレーム: 台 = 手の姿勢 × つかんだときの相対姿勢（手に貼り付く）
  if (!grab.ctrl) return;
  const a = arms[grab.armId]; if (!a) { grab.ctrl = null; return; }
  const w = composePose(inputPose(grab.ctrl), grab.rel), b = a.cfg.base;
  b.x = +w.p.x.toFixed(4); b.y = +w.p.y.toFixed(4); b.z = +w.p.z.toFixed(4); b.yaw_deg = +deg(yawOf(w.q)).toFixed(2);

function endGrab(c){
  if (grab.ctrl !== c) return;
  grab.ctrl = null; grab.rel = null;
  buildDesk(); buildEditor();
  if (!grab.moved) return;
  chime([520, 780]);
  grab.saveTimer = setTimeout(async () => { await saveConfig(); chime([660, 880, 1100]); }, GRAB_SAVE_DELAY_MS);

const controllers = [0, 1].map(i => {
  const c = renderer.xr.getController(i); scene.add(c);
  const h = renderer.xr.getHand(i); scene.add(h); c.userData.hand = h;
  // コントローラの基準点（点が取れる所）と短い光線。手のときは出さない（自分の指が見えている）
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.006, 10, 8), new THREE.MeshBasicMaterial({ color:0x60a5fa }));
  const ray = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -0.25)]), new THREE.LineBasicMaterial({ color:0x60a5fa }));
  dot.visible = ray.visible = false; c.add(dot, ray);
  c.addEventListener('connected', e => { c.userData.src = e.data; dot.visible = ray.visible = !(e.data && e.data.hand); });
  c.addEventListener('disconnected', () => { c.userData.src = null; dot.visible = ray.visible = false; endGrab(c); });
  c.addEventListener('selectstart', () => { unlockAudio(); startGrab(c); });
  c.addEventListener('selectend', () => endGrab(c));
  c.addEventListener('squeezestart', () => { unlockAudio(); startGrab(c); });
  c.addEventListener('squeezeend', () => endGrab(c));
  c.addEventListener('select', () => {
    unlockAudio();
    if (!calib.on) return;
    const src = c.userData.src;
    const tipJoint = src && src.hand && h.joints ? h.joints['index-finger-tip'] : null;
    const pos = new THREE.Vector3();
    if (tipJoint) tipJoint.getWorldPosition(pos);
    else { c.getWorldPosition(pos); if (calib.tipOffset) { const d = new THREE.Vector3(0, 0, -1).applyQuaternion(c.getWorldQuaternion(new THREE.Quaternion())); pos.addScaledVector(d, calib.tipOffset); } }
    captureCalibPoint(pos); chime([880]);
  });
  return c;
});
for (const id of ['btns', 'editor']) document.getElementById(id).addEventListener('beforexrselect', e => e.preventDefault());

// ───────── ボタン / キー ─────────
const btns = document.getElementById('btns');

function setForced(arm, o){ arm.forced = o; forceBtns.forEach(([b, name, id]) => { if (id === arm.id) b.classList.toggle('on', !!(o && o.name === name)); }); sendContact(arm, arm.forced ?? nearestObject(arm), true); }

    addBtn('ゴーグル: C 位置合わせ', () => postOp('calib_start'), 'calib'); addBtn('確定(保存)', () => postOp('calib_save'), 'calib');
    addBtn('取消(1 点)', () => postOp('calib_undo')); addBtn('中止', () => postOp('calib_cancel'));
    addBtn('ゴーグル: A アンカー解除', () => postOp('anchor_clear')); addBtn('ゴーグル: 再読込', () => postOp('reload'));
    addBtn('高さ −1 cm', () => nudgeDesk(-0.01)); addBtn('高さ +1 cm', () => nudgeDesk(0.01));
    addBtn('置き場所 近く', () => scaleSpots(0.9)); addBtn('置き場所 遠く', () => scaleSpots(1 / 0.9));
  }

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  unlockAudio();
  const arm = arms[selArm] || prim(); if (!arm) return;
  if (e.key === '0') setForced(arm, null);
  if (e.key === 'r' || e.key === 'R') resetPlacement();
  if (e.key === 'e' || e.key === 'E') toggleEditor();
  if (e.key === 'c' || e.key === 'C') { if (calib.on) stopCalib(true); else startCalib(); }
  if (e.key === 'Escape' && calib.on) { loadConfig(); stopCalib(false); }
  if (e.key === 'Backspace' && calib.on) undoCalibPoint();
  if (e.key === 'g' || e.key === 'G') cycleGhost();
  if (e.key === 'v' || e.key === 'V') { inlineView = VIEW_ORDER[(VIEW_ORDER.indexOf(inlineView) + 1) % VIEW_ORDER.length]; updateCam(); }
  if (e.key === 's' || e.key === 'S') { CONFIG.scene.sound = !CONFIG.scene.sound; }
  if (e.key === 'j' || e.key === 'J') { showNames = !showNames; }
  if (e.key === 'h' || e.key === 'H') { showInfo = !showInfo; buildButtons(); }
  if (e.key === 'b' || e.key === 'B') { targetsOn = !targetsOn; buildTargets(); }
  if (e.key === 'm' || e.key === 'M') { layout = LAYOUT_ORDER[(LAYOUT_ORDER.indexOf(layout) + 1) % LAYOUT_ORDER.length]; }
  if (e.key === 'Tab') { e.preventDefault(); selectNextArm(); }
  const i = parseInt(e.key, 10) - 1; if (i >= 0 && i < objs.length) setForced(arm, objs[i]);
});
addEventListener('beforeunload', () => { if (!SPECTATOR && navigator.sendBeacon) for (const id of armIds()) navigator.sendBeacon('/contact', new Blob([JSON.stringify({ arm:id, vwall:null })], { type:'application/json' })); });

// ───────── 編集モード（腕ごとの関節・台、物体、机、見せ方。保存＝/config） ─────────
const editor = document.getElementById('editor');
let editorOpen = false;
function toggleEditor(){ editorOpen = !editorOpen; editor.style.display = editorOpen ? 'block' : 'none'; if (editorOpen) buildEditor(); }
function num(label, get, set, step, min, max, after){
  const d = document.createElement('div'); d.className = 'row';
  d.innerHTML = `<label>${label}</label>`;
  const i = document.createElement('input'); i.type = 'number'; i.step = step; if (min !== undefined) i.min = min; if (max !== undefined) i.max = max; i.value = get();
  i.oninput = () => { const v = parseFloat(i.value); if (!isNaN(v)) { set(v); (after || applyBases)(); } };
  d.appendChild(i); return d;
}
function buildEditor(){
  if (!editorOpen) return;
  const arm = arms[selArm] || prim(); if (!arm) return;
  editor.innerHTML = '<h3>編集モード（E で閉じる）</h3><div class="row">分身の位置は「C 位置合わせ」が早い。ここは数値の微調整・物体・机。</div>';

  const rst = document.createElement('button'); rst.textContent = '既定に戻す'; rst.onclick = () => resetConfig();
  const cls = document.createElement('button'); cls.textContent = '閉じる'; cls.onclick = toggleEditor;
  head.append(save, rst, cls); editor.appendChild(head);
  const ha = document.createElement('div'); ha.className = 'row'; ha.innerHTML = '<label>腕</label>';
  const sel = document.createElement('select'); armIds().forEach(id => { const op = document.createElement('option'); op.value = id; op.textContent = `${id} ${CONFIG.arms[id].label}`; sel.appendChild(op); });
  sel.value = selArm; sel.onchange = () => { selArm = sel.value; buildEditor(); buildButtons(); }; ha.appendChild(sel); editor.appendChild(ha);
  const hj = document.createElement('h3'); hj.textContent = `腕 ${arm.id} の関節（表示スパン°・オフセット°・向き）`; editor.appendChild(hj);
  JOINTS.forEach(j => {
    const m = arm.cfg.joints[j];
    const d = document.createElement('div'); d.className = 'row'; d.innerHTML = `<label style="width:96px">${JOINT_NAMES[j]}</label>`;
    const span = document.createElement('input'); span.type = 'number'; span.step = 5; span.value = m.span_deg; span.title = 'span_deg'; span.oninput = () => { m.span_deg = parseFloat(span.value) || m.span_deg; };
    const off = document.createElement('input'); off.type = 'number'; off.step = 1; off.value = m.offset_deg; off.title = 'offset_deg'; off.oninput = () => { m.offset_deg = parseFloat(off.value) || 0; };
    const sg = document.createElement('select'); sg.innerHTML = '<option value="1">+</option><option value="-1">−</option>'; sg.value = String(m.sign); sg.onchange = () => { m.sign = parseInt(sg.value, 10); };
    d.append(span, off, sg); editor.appendChild(d);
  });
  const hb = document.createElement('h3'); hb.textContent = `腕 ${arm.id} の台（m・yaw°）`; editor.appendChild(hb);
  const b = arm.cfg.base, afterBase = () => { applyBases(true); buildDesk(); };
  editor.appendChild(num('x', () => b.x, v => b.x = v, 0.01, undefined, undefined, afterBase));
  editor.appendChild(num('y', () => b.y, v => b.y = v, 0.01, undefined, undefined, afterBase));
  editor.appendChild(num('z', () => b.z, v => b.z = v, 0.01, undefined, undefined, afterBase));
  editor.appendChild(num('yaw', () => b.yaw_deg, v => b.yaw_deg = v, 5, undefined, undefined, afterBase));
  const ho = document.createElement('h3'); ho.textContent = '物体（幅・P・上限mA・重さg・反発0-1）'; editor.appendChild(ho);
  objs.forEach(o => {
    const c = o.cfg;
    const d = document.createElement('div'); d.className = 'row'; d.innerHTML = `<label>${c.label}</label>`;
    [['width',1,0,100],['p_gain',50,0,16383],['cap_ma',10,0,900],['mass_g',5,0,2000],['bounce',0.05,0,1]].forEach(([k,step,lo,hi]) => {
      const i = document.createElement('input'); i.type = 'number'; i.step = step; i.min = lo; i.max = hi; i.value = c[k]; i.title = k;
      i.oninput = () => { const v = parseFloat(i.value); if (!isNaN(v)) { c[k] = v; if (k === 'width') buildObjects(); } };
      d.appendChild(i);
    });
    const here = document.createElement('button'); here.textContent = 'ここに置く';
    here.onclick = () => { arm.tip.getWorldPosition(tipW); prim().group.worldToLocal(tipL.copy(tipW)); c.spot = [+tipL.x.toFixed(3), 0, +tipL.z.toFixed(3)]; placeAtSpot(o); };
    d.appendChild(here); editor.appendChild(d);
  });
  const hs = document.createElement('h3'); hs.textContent = '机（1 本目の腕の座標・m）と見せ方'; editor.appendChild(hs);
  const dk = CONFIG.scene.desk, afterDesk = () => buildDesk();
  editor.appendChild(num('x', () => dk.x, v => dk.x = v, 0.05, -2, 2, afterDesk));
  editor.appendChild(num('z', () => dk.z, v => dk.z = v, 0.05, -2, 2, afterDesk));
  const afterDeskY = () => { buildDesk(); buildTargets(); for (const o of objs) if (o.asleep && !o.heldBy && onDesk(o.mesh.position.x, o.mesh.position.z)) o.mesh.position.y = deskY() + o.half + REST_LIFT; };
  editor.appendChild(num('高さ y（物が乗る面）', () => dk.y ?? 0, v => dk.y = v, 0.01, -0.5, 0.5, afterDeskY));
  editor.appendChild(num('幅 w', () => dk.w, v => dk.w = v, 0.1, 0.2, 3, afterDesk));
  editor.appendChild(num('奥行 d', () => dk.d, v => dk.d = v, 0.1, 0.2, 3, afterDesk));
  const hg = document.createElement('div'); hg.className = 'row'; hg.innerHTML = '<label>AR の分身</label>';
  const gs = document.createElement('select'); gs.innerHTML = '<option value="solid">実体</option><option value="half">半透明</option><option value="tips">指先だけ</option>'; gs.value = CONFIG.scene.ghost || 'half'; gs.onchange = () => { CONFIG.scene.ghost = gs.value; applyGhost(); };
  const snd = document.createElement('label'); snd.style.width = 'auto'; snd.style.marginLeft = '8px'; const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!CONFIG.scene.sound; cb.onchange = () => { CONFIG.scene.sound = cb.checked; }; snd.append(cb, ' 音');
  hg.append(gs, snd); editor.appendChild(hg);
}
async function saveConfig(){
  try { const r = await fetch('/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(CONFIG) });
        if (r.ok) { noteConfigVersion(r); adoptConfig(await r.json()); for (const a of Object.values(arms)) a.sendStatus = '設定を保存'; } else { for (const a of Object.values(arms)) a.sendStatus = `設定保存 HTTP ${r.status}`; } }
  catch(e) { for (const a of Object.values(arms)) a.sendStatus = '設定保存 失敗(サーバなし)'; }
  if (renderer.xr.isPresenting && anchorsOk) for (const id of armIds()) anchorReq.add(id);   // 保存した台の位置をアンカーとして登録し直す
}
async function resetConfig(){
  adoptConfig(structuredClone(DEFAULTS));
  try { const r = await fetch('/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ reset:true }) });
        if (r.ok) adoptConfig(await r.json()); } catch(e) { /* offline */ }
}

// ───────── XR セッション（AR 優先・VR・非対応はインライン） ─────────
let arActive = false;
const xrButtons = [];
async function startXR(mode){
  try {
    unlockAudio();
    const features = ['local-floor', 'dom-overlay', 'hand-tracking']; if (ANCHORS_ON) features.push('anchors');
    const init = { optionalFeatures: features, domOverlay: { root: document.body } };
    const s = await navigator.xr.requestSession(mode, init);
    arActive = (mode === 'immersive-ar');
    scene.background = arActive ? null : new THREE.Color(0x27364a);
    grid.visible = !arActive;
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(s);
    xrSession = s; anchorsOk = ANCHORS_ON && (Array.isArray(s.enabledFeatures) ? s.enabledFeatures.includes('anchors') : true);
    if (anchorsOk) restoreAnchors(s); else for (const id of armIds()) anchorState[id] = blankAnchor(ANCHORS_ON ? 'アンカー非対応→台は設定値' : '');
    applyGhost(); buildButtons();
    s.addEventListener('end', () => {
      arActive = false; xrSession = null; anchorsOk = false; for (const id of Object.keys(anchorState)) delete anchorState[id];
      scene.background = INLINE_BG; grid.visible = true; applyGhost(); if (calib.on) stopCalib(false); applyBases(); buildButtons();
    });
  } catch(e) { hudMode.innerHTML = 'XR開始失敗: ' + e.message; }
}
(async () => {
  scene.background = INLINE_BG;
  if (navigator.xr) {
    if (await navigator.xr.isSessionSupported('immersive-ar').catch(() => false)) xrButtons.push(['AR表示（パススルー）', () => startXR('immersive-ar')]);
    if (await navigator.xr.isSessionSupported('immersive-vr').catch(() => false)) xrButtons.push(['VR表示', () => startXR('immersive-vr')]);
  } else if (!window.isSecureContext) {
    hudMode.innerHTML = '⚠ この URL は安全なコンテキストではないため WebXR が使えません（https か http://localhost で開く）';
  }
  buildButtons();
})();
buildArms(); buildObjects(); updateCam(); buildButtons();
// デバッグ用の窓（デスクトップのコンソール／自動テストから物理と接触の状態を読む）
window.koch4 = {
  objs: () => objs.map(o => ({ name:o.name, heldBy:o.heldBy, asleep:o.asleep, p:o.mesh.position.toArray().map(v => +v.toFixed(3)), v:o.v.toArray().map(v => +v.toFixed(3)) })),
  arms: () => Object.fromEntries(Object.entries(arms).map(([k, a]) => [k, { current: a.current && a.current.name, forced: a.forced && a.forced.name, sendStatus: a.sendStatus, base: a.cfg.base }])),
  config: () => CONFIG, calib, force: (armId, name) => setForced(arms[armId], objs.find(o => o.name === name) || null),
  anchors: () => Object.fromEntries(Object.entries(anchorState).map(([k, s]) => [k, { uuid:s.uuid, status:s.status, hasAnchor: !!s.anchor }])),
  anchorState, mkPose: b => baseToPose(b), updateAnchors,   // 実機の開発者ツールや自動テストから、アンカーの状態を読み書きする
};
// 自己診断（デスクトップのコンソールで koch4AnchorSelfTest()）: 差分の往復と、原点が変わったときに台がアンカーと一緒に動くこと
// ───────── Mac の操作ページとの連携: 操作キュー（/op → /state.op）と状態報告（/status → /state.page） ─────────
const SPOT_R_MIN = 0.08, SPOT_R_MAX = 0.30;   // 置き場所を近く／遠くするときの台からの距離の範囲 [m]
async function postOp(kind, extra){
  try { await fetch('/op', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({ op: kind, arm: selArm }, extra || {})) }); }
  catch(e) { /* サーバなし */ }
}
function runOp(op){   // ブリッジ経由で届いた操作。reset と reload は全ページ、残りはゴーグル（握る側）のページだけ
  if (op.op === 'reload') { location.reload(); return; }
  if (op.op === 'reset') { resetPlacement(); return; }
  if (SPECTATOR) return;
  if (op.arm && arms[op.arm]) selArm = op.arm;
  if (op.op === 'select_arm') { buildButtons(); return; }
  if (op.op === 'calib_start') { if (!calib.on) startCalib(); }
  else if (op.op === 'calib_save') { if (calib.on) stopCalib(true); }
  else if (op.op === 'calib_cancel') { if (calib.on) { loadConfig(); stopCalib(false); } }
  else if (op.op === 'calib_undo') { if (calib.on) undoCalibPoint(); }
  else if (op.op === 'anchor_clear') { clearAnchors(); }
  else if (op.op === 'ghost') { cycleGhost(); }
  unlockAudio(); chime([440]);
}
async function reportStatus(){   // 1 秒ごと: 位置合わせの点数・残差・アンカーの状態を Mac へ（ゴーグルには文字が出ないので）
  if (SPECTATOR) return;
  const a = arms[selArm] || prim(), an = anchorState[selArm];
  const body = { arm: selArm, presenting: renderer.xr.isPresenting, ar: arActive, calib_on: calib.on, points: calib.points.length,
    residual_cm: (a && calib.points.length >= 2) ? +(calibResidual(a) * 100).toFixed(1) : null, anchor: an ? an.status : '', grab: !!grab.ctrl, base: a ? a.cfg.base : null };
  try { await fetch('/status', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); } catch(e) { /* サーバなし */ }
}
setInterval(reportStatus, 1000);
function nudgeDesk(d){ const dk = CONFIG.scene.desk; dk.y = +(((dk.y || 0) + d).toFixed(3)); buildDesk(); buildTargets(); saveConfig(); }
function scaleSpots(f){   // 置き場所を台から近く／遠くへ（距離を f 倍・8〜30 cm に収める）
  for (const o of Object.values(CONFIG.objects)) {
    const [x, y, z] = o.spot, r = Math.hypot(x, z); if (r < 1e-6) continue;
    const nr = Math.min(SPOT_R_MAX, Math.max(SPOT_R_MIN, r * f)), k = nr / r;
    o.spot = [+(x * k).toFixed(3), y, +(z * k).toFixed(3)];
  }
  saveConfig();
}
window.koch4.grab = grab; window.koch4.startCalib = startCalib; window.koch4.stopCalib = stopCalib;   // Mac からの遠隔操作（DevTools）用
window.koch4.postOp = postOp; window.koch4.runOp = runOp; window.koch4.nudgeDesk = nudgeDesk; window.koch4.scaleSpots = scaleSpots;
window.koch4.saveConfig = saveConfig; window.koch4.loadConfig = loadConfig; window.koch4.resetPlacement = resetPlacement;
// 自己診断（デスクトップのコンソールで koch4GrabSelfTest()）: 手を平行移動すれば台も同じだけ動き、手をその場で回せば台は手の周りを同じ角度だけ回る
window.koch4GrabSelfTest = function(){
  const base0 = { x:0.1, y:0.75, z:-0.6, yaw_deg:15 };
  const hand0 = { p:new THREE.Vector3(0.3, 1.0, -0.4), q:new THREE.Quaternion().setFromAxisAngle(UP, rad(-20)) };
  const rel = relativePose(hand0, baseToPose(base0));
  const moved = composePose({ p: hand0.p.clone().add(new THREE.Vector3(0.1, 0.05, -0.2)), q: hand0.q.clone() }, rel);   // 平行移動だけ
  const e1 = moved.p.distanceTo(new THREE.Vector3(base0.x + 0.1, base0.y + 0.05, base0.z - 0.2)), e2 = Math.abs(deg(yawOf(moved.q)) - base0.yaw_deg);
  const turned = composePose({ p: hand0.p.clone(), q: new THREE.Quaternion().setFromAxisAngle(UP, rad(-20 + 30)) }, rel);   // その場で 30° 回す
  const r0 = hand0.p.distanceTo(new THREE.Vector3(base0.x, base0.y, base0.z)), r1 = hand0.p.distanceTo(turned.p);
  const e3 = Math.abs(r1 - r0), e4 = Math.abs(deg(yawOf(turned.q)) - (base0.yaw_deg + 30)), e5 = Math.abs(turned.p.y - base0.y);
  return { ok: e1 < 1e-6 && e2 < 1e-6 && e3 < 1e-6 && e4 < 1e-6 && e5 < 1e-6, e1, e2, e3, e4, e5 };
};
window.koch4AnchorSelfTest = function(){
  const arm = prim(); const keepBase = structuredClone(arm.cfg.base), keepSt = anchorState[arm.id];
  const A = { p:new THREE.Vector3(0.3, 0.1, -0.2), q:new THREE.Quaternion().setFromAxisAngle(UP, rad(25)) };
  const B = { x:0.5, y:0.72, z:-0.6, yaw_deg:-37 };
  const off = relativePose(A, baseToPose(B)), back = composePose(A, off);
  const e1 = back.p.distanceTo(new THREE.Vector3(B.x, B.y, B.z)), e2 = Math.abs(deg(yawOf(back.q)) - B.yaw_deg);
  const A2 = { p:new THREE.Vector3(-0.4, 0.1, 0.9), q:new THREE.Quaternion().setFromAxisAngle(UP, rad(-80)) };   // 別の原点から見たアンカー
  anchorState[arm.id] = { anchor:{ anchorSpace:'fake' }, uuid:'test', pose:null, off, status:'' };
  const frame = { getPose: () => ({ transform: { position:{ x:A2.p.x, y:A2.p.y, z:A2.p.z }, orientation:{ x:A2.q.x, y:A2.q.y, z:A2.q.z, w:A2.q.w } } }) };
  updateAnchors(frame, 'fakeRef');
  const exp = composePose(A2, off);
  const e3 = arm.group.position.distanceTo(exp.p), e4 = Math.abs(deg(yawOf(arm.group.quaternion)) - deg(yawOf(exp.q)));
  const e5 = Math.hypot(arm.cfg.base.x - exp.p.x, arm.cfg.base.y - exp.p.y, arm.cfg.base.z - exp.p.z);
  if (keepSt) anchorState[arm.id] = keepSt; else delete anchorState[arm.id];
  arm.cfg.base = keepBase; applyBases(); buildDesk();
  return { ok: e1 < 1e-6 && e2 < 1e-6 && e3 < 1e-6 && e4 < 1e-6 && e5 < 1e-3, e1, e2, e3, e4, e5 };
};
const _buildObjects = buildObjects;
buildObjects = function(){ _buildObjects(); buildButtons(); };
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop((t, frame) => {
  if (renderer.xr.isPresenting) { paneA.style.display = paneB.style.display = 'none'; updateGrab(); updateAnchors(frame); applyPose(t); renderer.render(scene, camera); return; }
  updateCam(); applyPose(t); renderer.setViewport(0, 0, innerWidth, innerHeight); renderInline();
});
