monorepo_root = true

[tools]
uv = "0.12.5"

[monorepo]
config_roots = ["twinarm", "twinarm-web-ui", "discovery/koch"]

[tasks.format]
description = "Run format in every subproject"
depends = ["//twinarm:format", "//twinarm-web-ui:format", "//discovery/koch:format"]

[tasks.check]
description = "Run check in every subproject (discovery/dobot is excluded: it needs real hardware)"
depends = ["//twinarm:check", "//twinarm-web-ui:check", "//discovery/koch:check"]
