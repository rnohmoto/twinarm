[project]
name = "dobot"
version = "0.1.0"
description = "Dobot Magician pick-and-place sandbox: overhead camera -> homography -> pydobot (voice/LLM optional)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "pyserial>=3.4",          # pydobot 1.3.2 pins pyserial==3.4
    "pydobot>=1.3",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4"]

[project.scripts]
dobot-launcher = "dobot.launcher:main"
dobot-setup = "dobot.setup_wizard:main"
dobot-demo = "dobot.demo:main"
dobot-pnp = "dobot.main:main"
dobot-calibrate = "dobot.calibrate:main"
dobot-jog = "dobot.jog:main"
dobot-suction = "dobot.suction:main"
dobot-check-camera = "dobot.check_camera:main"
dobot-check-robot = "dobot.check_robot:main"
dobot-zones = "dobot.zones_view:main"
dobot-config = "dobot.config:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Co-located test packages stay out of the wheel; they import dev-only deps.
wheel-exclude = ["tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["src"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# Sandbox scripts ported from robotics/scripts/magician_pnp (S30). Docstring style is
# not enforced here, on the same standing as discovery/.
"*.py" = ["D"]
